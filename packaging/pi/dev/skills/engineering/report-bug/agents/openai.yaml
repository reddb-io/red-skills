interface:
  display_name: "Report Bug"
  short_description: "Interview the user about a bug they hit, then file a structured type:bug needs-triage issue on the project tracker. Pulls seed material from the conversation context when invoked with no arguments, or from the argument when one is provided. Use when the user says \"report a bug\", \"open a bug\", \"this is broken - file it\", \"/report-bug ...\", or otherwise wants a bug captured on the tracker without going through full triage themselves."
policy:
  allow_implicit_invocation: false
