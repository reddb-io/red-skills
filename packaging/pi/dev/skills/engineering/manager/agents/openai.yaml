interface:
  display_name: "Manager"
  short_description: "Operator liaison that carries one effort from raw intent through the existing owner workflows. $dev:manager <intent> starts an effort and persists it in the operator-scoped portfolio; status renders its brief; checkpoint export/import carries the portfolio to another host. Use when the user invokes /manager, asks to start or continue an effort, asks where an effort stands, or wants to move a portfolio between hosts."
policy:
  allow_implicit_invocation: false
