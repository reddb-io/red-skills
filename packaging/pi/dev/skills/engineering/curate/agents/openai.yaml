interface:
  display_name: "Curate"
  short_description: "Interactive Skill curator. Reads memory curate skills --json, groups Curatable-skill candidates by category (stale, abandoned, frequently-failing, archive), asks for explicit approval, archives the approved set recoverably with the approving category recorded in the manifest, and reverses any archive with /curate --restore <name>. With --background, files a single ready-for-human Issue listing candidates and never mutates a Skill file."
policy:
  allow_implicit_invocation: false
