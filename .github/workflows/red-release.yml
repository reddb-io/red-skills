name: red-release

# Auto-release on push to main:
#   1. Defer if any open issue carries the `running` label (a /afk fleet is
#      mid-iteration — auto-pushing a release commit would yank origin/main
#      out from under in-flight workers, causing merge-conflict cascades).
#   2. Parse conventional commits since the last vX.Y.Z tag.
#      - BREAKING CHANGE / `feat!:` / `fix!:` → major bump
#      - `feat:`                              → minor bump
#      - anything else (`fix:`, `chore:`, …) → patch bump
#      - no `feat`/`fix`/`!` commits          → skip (no release)
#   3. Sync plugins/dev/.claude-plugin/plugin.json `version` field.
#   4. Commit the bump back to main (marker `[skip release]` to avoid loop).
#   5. Create the git tag and a GitHub Release with auto-generated notes.
#   6. Move the matching major tag (for example `v1`) to the same commit so
#      reusable workflows and actions pinned to `@v1` keep receiving releases.

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  group: red-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    # Repository settings protect the red-release environment with required
    # reviewers. Approval happens before this job can build, publish assets, or
    # move the matching major tag.
    environment:
      name: red-release
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}
          # red-castle is a submodule under packages/; the dev bundle + pnpm
          # install resolve it as the @reddb-io/red-castle workspace package.
          submodules: recursive

      - name: Defer if /afk fleet is active
        id: fleet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          running=$(gh issue list --label running --state open --json number --jq 'length' 2>/dev/null || echo "0")
          echo "running=$running" >> "$GITHUB_OUTPUT"
          if [ "$running" -gt 0 ]; then
            echo "::notice::🛑 fleet active — $running issue(s) carry the 'running' label. Release deferred; the fleet's next push to main after the running issues drain will retry."
          else
            echo "no running issues — proceeding"
          fi

      - name: Validate install metadata
        if: steps.fleet.outputs.running == '0'
        run: scripts/validate-install-metadata.sh

      - name: Test workflow security pins
        if: steps.fleet.outputs.running == '0'
        run: scripts/test-workflow-security-pins.sh

      - name: Test agent metadata fixtures
        if: steps.fleet.outputs.running == '0'
        run: scripts/test-validate-agent-metadata.sh

      - name: Decide bump kind
        id: bump
        if: steps.fleet.outputs.running == '0'
        run: |
          set -euo pipefail
          latest=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            range="HEAD"
          else
            range="${latest}..HEAD"
          fi
          subjects=$(git log "$range" --format='%s%n%b' || true)

          kind="none"
          if grep -qE '(^|\n)(feat|fix)!:|BREAKING CHANGE' <<<"$subjects"; then
            kind="major"
          elif grep -qE '(^|\n)feat(\([^)]*\))?:' <<<"$subjects"; then
            kind="minor"
          elif grep -qE '(^|\n)fix(\([^)]*\))?:' <<<"$subjects"; then
            kind="patch"
          fi

          echo "previous=$latest" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "Bump kind: $kind (previous tag: ${latest:-none})"

      - name: Skip if no releasable commits
        if: steps.fleet.outputs.running == '0' && steps.bump.outputs.kind == 'none'
        run: |
          echo "No feat/fix commits since ${{ steps.bump.outputs.previous }} — nothing to release."

      - name: Compute next version
        id: version
        if: steps.fleet.outputs.running == '0' && steps.bump.outputs.kind != 'none'
        env:
          KIND: ${{ steps.bump.outputs.kind }}
          PREVIOUS: ${{ steps.bump.outputs.previous }}
        run: |
          set -euo pipefail
          if [ -z "$PREVIOUS" ]; then
            next="v0.1.0"
          else
            IFS='.' read -r major minor patch <<<"${PREVIOUS#v}"
            case "$KIND" in
              major) next="v$((major + 1)).0.0" ;;
              minor) next="v${major}.$((minor + 1)).0" ;;
              patch) next="v${major}.${minor}.$((patch + 1))" ;;
            esac
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Releasing $next"

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        if: steps.fleet.outputs.running == '0' && steps.bump.outputs.kind != 'none'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.fleet.outputs.running == '0' && steps.bump.outputs.kind != 'none'
        with:
          node-version: 22

      - name: Install workspace dependencies
        if: steps.fleet.outputs.running == '0' && steps.bump.outputs.kind != 'none'
        env:
          # The release job builds JS bundles and manifests; it does not execute
          # the @reddb-io/sdk-backed memory/brain runtimes during install. Skip
          # the SDK postinstall binary download so release is not blocked when
          # the matching reddb binary asset is unavailable.
          REDDB_SKIP_POSTINSTALL: "1"
        run: pnpm install --frozen-lockfile

      # ADR 0091: the plugin bundles are distributed over npm with npm's own
      # tarball shasum/provenance for integrity — the client no longer verifies a
      # hand-rolled sigstore manifest signature, so cosign is not installed and
      # manifests are not signed.

      # ADR 0032: AFK ships as a committed, dependency-free bundle. Rebuild it
      # from apps/dev (which lives outside the plugin tree) so the shipped
      # bin/afk.mjs is always byte-for-byte the build of the released source,
      # then stage it into the version-bump commit below. esbuild output is
      # deterministic, so unchanged source rebuilds to identical bytes and the
      # git add is a no-op.
      - name: Build dev runtime bundle
        if: steps.fleet.outputs.running == '0' && steps.bump.outputs.kind != 'none'
        working-directory: apps/dev
        env:
          NEXT: ${{ steps.version.outputs.next }}
          RED_BUILD_VERSION: ${{ steps.version.outputs.next }}
          RED_BUILD_GIT_SHA: ${{ github.sha }}
          RED_BUILD_TIME: ${{ github.event.head_commit.timestamp }}
        run: |
          set -euo pipefail
          # ADR 0038: the dev runtime ships as a Release asset (dev.bundle.min.mjs),
          # NOT a committed bundle. ADR 0039: the two committed, dependency-free
          # entrypoints — plugins/dev/hooks/red-fetch.mjs (fetch role) and
          # plugins/dev/skills/engineering/afk/bin/afk.mjs (run:dev role) — are built
          # from ONE source, packages/shared/entrypoint-cli.ts. `build` emits the
          # dist/dev.bundle.min.mjs asset (ADR 0034) plus both entrypoints. They carry
          # no version, so esbuild's deterministic output rebuilds to identical bytes
          # and the git add below is a no-op unless the source actually changed.
          pnpm build
          # Checksum manifest the dynamic-fetch hook (packages/shared/bundle-fetch.ts)
          # verifies before caching. Mirrors memory-runtime-manifest.json.
          node --input-type=module <<'EOF'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const bytes = readFileSync('../../dist/dev.bundle.min.mjs');
          const manifest = {
            plugin: 'dev',
            version: process.env.NEXT.replace(/^v/, ''),
            sha256: createHash('sha256').update(bytes).digest('hex'),
          };
          writeFileSync('../../dist/dev.manifest.json', JSON.stringify(manifest, null, 2));
          console.log('dev runtime manifest:', JSON.stringify(manifest));
          EOF

      - name: Sync plugin manifest versions
        if: steps.fleet.outputs.running == '0' && steps.bump.outputs.kind != 'none'
        env:
          NEXT: ${{ steps.version.outputs.next }}
          RED_BUILD_VERSION: ${{ steps.version.outputs.next }}
          RED_BUILD_GIT_SHA: ${{ github.sha }}
          RED_BUILD_TIME: ${{ github.event.head_commit.timestamp }}
        run: |
          set -euo pipefail
          manifests=(
            plugins/dev/.claude-plugin/plugin.json
            plugins/dev/.codex-plugin/plugin.json
            plugins/memory/.claude-plugin/plugin.json
            plugins/memory/.codex-plugin/plugin.json
            plugins/brain/.claude-plugin/plugin.json
            plugins/brain/.codex-plugin/plugin.json
          )
          package_jsons=(
            package.json
            apps/dev/package.json
            apps/memory/package.json
            apps/brain/package.json
            apps/opencode-host/package.json
            apps/benchmark-memory/package.json
            apps/benchmark-code-understanding/package.json
            apps/code-nav/package.json
            packages/shared/package.json
            packages/build-info/package.json
          )
          # ADR 0039: both committed entrypoints are built from entrypoint-cli.ts by
          # `pnpm build` above. Stage both so a source change ships; they carry no
          # version, so an unchanged source leaves them byte-identical (git add no-op).
          fetch_bundle=plugins/dev/hooks/red-fetch.mjs
          afk_bundle=plugins/dev/skills/engineering/afk/bin/afk.mjs
          new="${NEXT#v}"
          for manifest in "${manifests[@]}"; do
            tmp=$(mktemp)
            jq --arg v "$new" '.version = $v' "$manifest" > "$tmp"
            mv "$tmp" "$manifest"
          done
          for package_json in "${package_jsons[@]}"; do
            tmp=$(mktemp)
            jq --arg v "$new" '.version = $v' "$package_json" > "$tmp"
            mv "$tmp" "$package_json"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The bump commit stages ZERO files under .github/workflows/: the
          # GITHUB_TOKEN cannot push commits that touch workflow files, so the
          # first-party afk-attempt pin lives on the moving major @v1 tag (force-
          # moved to HEAD each cut below) instead of being rewritten here.
          if git diff --quiet -- "${manifests[@]}" "${package_jsons[@]}" "$fetch_bundle" "$afk_bundle"; then
            echo "plugin/package manifests already at $new and entrypoints unchanged"
          else
            git add "${manifests[@]}" "${package_jsons[@]}" "$fetch_bundle" "$afk_bundle"
            git commit -m "chore(release): $NEXT [skip release]"
            # Rebase-resilient push: red-memory-wiki-extract.yml also pushes to
            # main on PR-merge (via GITHUB_TOKEN, which can't re-trigger this
            # workflow), so the bump push races it and loses on a plain push.
            # Retry with a rebase so a concurrent push never wedges the release.
            pushed=0
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then pushed=1; break; fi
              echo "push rejected (attempt $attempt) — rebasing onto origin/main"
              git fetch origin main
              git rebase origin/main
            done
            if [ "$pushed" != 1 ]; then
              echo "::error::bump push to main failed after 3 attempts"
              exit 1
            fi
          fi

      # ADR 0029: the Memory runtime ships as release assets, not committed
      # build output. esbuild bundles the CLI (all JS deps inlined) into one
      # platform-independent file; a manifest pins its checksum + the reddb tag
      # whose per-platform `red` binaries the bootstrap reuses. Assets are
      # attached at `gh release create` so they exist the moment the Release
      # publishes. pnpm/node are already set up above for the AFK bundle.
      - name: Build memory runtime bundle + manifest
        if: steps.fleet.outputs.running == '0' && steps.bump.outputs.kind != 'none'
        working-directory: apps/memory
        env:
          NEXT: ${{ steps.version.outputs.next }}
          RED_BUILD_VERSION: ${{ steps.version.outputs.next }}
          RED_BUILD_GIT_SHA: ${{ github.sha }}
          RED_BUILD_TIME: ${{ github.event.head_commit.timestamp }}
        run: |
          set -euo pipefail
          # ADR 0052: one canonical, minified bundle per entrypoint, all under
          # ./dist/ (memory.bundle.min.mjs = CLI, memory-mcp.bundle.min.mjs = MCP).
          # The legacy dist-bundle/*-cli.mjs model was removed; the bootstrap reads
          # the asset names from this manifest, so the rename follows per-version.
          pnpm bundle
          node --input-type=module <<'EOF'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const sdk = pkg.dependencies['@reddb-io/sdk'];
          const reddb = {
            repo: 'reddb-io/reddb',
            tag: `v${sdk}`,
          };
          const assetNames = {
            'linux-x86_64': 'red-linux-x86_64',
            'linux-aarch64': 'red-linux-aarch64',
            'linux-armv7': 'red-linux-armv7',
            'macos-x86_64': 'red-macos-x86_64',
            'macos-aarch64': 'red-macos-aarch64',
            'windows-x86_64': 'red-windows-x86_64.exe',
          };
          async function previousRedAssets() {
            const url = 'https://github.com/reddb-io/red-skills/releases/latest/download/memory-runtime-manifest.json';
            const response = await fetch(url, { redirect: 'follow' });
            if (!response.ok) throw new Error(`GET ${url} -> ${response.status}`);
            const previous = await response.json();
            if (previous?.reddb?.sdk !== sdk || previous?.reddb?.tag !== reddb.tag) {
              throw new Error(`latest memory runtime manifest points at ${previous?.reddb?.tag ?? 'unknown'} / ${previous?.reddb?.sdk ?? 'unknown'}, expected ${reddb.tag} / ${sdk}`);
            }
            return previous.reddb.assets ?? {};
          }
          const fallbackAssets = await previousRedAssets();
          const redAssets = {};
          for (const [platform, asset] of Object.entries(assetNames)) {
            const url = `https://github.com/${reddb.repo}/releases/download/${reddb.tag}/${asset}.sha256`;
            const response = await fetch(url, { redirect: 'follow' });
            let sha256 = "";
            if (response.ok) {
              sha256 = (await response.text()).match(/\b[0-9a-f]{64}\b/i)?.[0]?.toLowerCase() ?? "";
            } else {
              const fallback = fallbackAssets[platform];
              if (fallback?.asset !== asset || !fallback?.sha256) throw new Error(`GET ${url} -> ${response.status}`);
              sha256 = fallback.sha256;
            }
            if (!sha256) throw new Error(`invalid sha256 file for ${asset}`);
            redAssets[platform] = { asset, sha256 };
          }
          const cli = readFileSync('../../dist/memory.bundle.min.mjs');
          const mcp = readFileSync('../../dist/memory-mcp.bundle.min.mjs');
          const manifest = {
            schema: 'red.memory.runtime.v1',
            version: process.env.NEXT.replace(/^v/, ''),
            cli: { asset: 'memory.bundle.min.mjs', sha256: createHash('sha256').update(cli).digest('hex') },
            mcp: { asset: 'memory-mcp.bundle.min.mjs', sha256: createHash('sha256').update(mcp).digest('hex') },
            reddb: { ...reddb, sdk, assets: redAssets },
          };
          writeFileSync('../../dist/memory-runtime-manifest.json', JSON.stringify(manifest, null, 2));
          console.log('runtime manifest:', JSON.stringify(manifest));
          EOF

      # ADR 0029/0038: the Brain runtime ships as release assets, not committed
      # build output (mirrors memory). esbuild bundles the CLI + MCP (all JS deps
      # inlined); a manifest pins their checksums + the reddb tag whose
      # per-platform `red` binaries the bootstrap reuses. Attached at
      # `gh release create`; fetched by plugins/brain/scripts/bootstrap.mjs.
      - name: Build brain runtime bundle + manifest
        if: steps.fleet.outputs.running == '0' && steps.bump.outputs.kind != 'none'
        working-directory: apps/brain
        env:
          NEXT: ${{ steps.version.outputs.next }}
          RED_BUILD_VERSION: ${{ steps.version.outputs.next }}
          RED_BUILD_GIT_SHA: ${{ github.sha }}
          RED_BUILD_TIME: ${{ github.event.head_commit.timestamp }}
        run: |
          set -euo pipefail
          # ADR 0052: canonical minified bundles under ./dist/ (brain.bundle.min.mjs
          # = CLI, brain-mcp.bundle.min.mjs = MCP); legacy dist-bundle removed.
          pnpm bundle
          node --input-type=module <<'EOF'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const sdk = pkg.dependencies['@reddb-io/sdk'];
          const reddb = {
            repo: 'reddb-io/reddb',
            tag: `v${sdk}`,
          };
          const assetNames = {
            'linux-x86_64': 'red-linux-x86_64',
            'linux-aarch64': 'red-linux-aarch64',
            'linux-armv7': 'red-linux-armv7',
            'macos-x86_64': 'red-macos-x86_64',
            'macos-aarch64': 'red-macos-aarch64',
            'windows-x86_64': 'red-windows-x86_64.exe',
          };
          async function previousRedAssets() {
            const url = 'https://github.com/reddb-io/red-skills/releases/latest/download/brain-runtime-manifest.json';
            const response = await fetch(url, { redirect: 'follow' });
            if (!response.ok) throw new Error(`GET ${url} -> ${response.status}`);
            const previous = await response.json();
            if (previous?.reddb?.sdk !== sdk || previous?.reddb?.tag !== reddb.tag) {
              throw new Error(`latest brain runtime manifest points at ${previous?.reddb?.tag ?? 'unknown'} / ${previous?.reddb?.sdk ?? 'unknown'}, expected ${reddb.tag} / ${sdk}`);
            }
            return previous.reddb.assets ?? {};
          }
          const fallbackAssets = await previousRedAssets();
          const redAssets = {};
          for (const [platform, asset] of Object.entries(assetNames)) {
            const url = `https://github.com/${reddb.repo}/releases/download/${reddb.tag}/${asset}.sha256`;
            const response = await fetch(url, { redirect: 'follow' });
            let sha256 = "";
            if (response.ok) {
              sha256 = (await response.text()).match(/\b[0-9a-f]{64}\b/i)?.[0]?.toLowerCase() ?? "";
            } else {
              const fallback = fallbackAssets[platform];
              if (fallback?.asset !== asset || !fallback?.sha256) throw new Error(`GET ${url} -> ${response.status}`);
              sha256 = fallback.sha256;
            }
            if (!sha256) throw new Error(`invalid sha256 file for ${asset}`);
            redAssets[platform] = { asset, sha256 };
          }
          const cli = readFileSync('../../dist/brain.bundle.min.mjs');
          const mcp = readFileSync('../../dist/brain-mcp.bundle.min.mjs');
          const manifest = {
            schema: 'red.brain.runtime.v1',
            version: process.env.NEXT.replace(/^v/, ''),
            cli: { asset: 'brain.bundle.min.mjs', sha256: createHash('sha256').update(cli).digest('hex') },
            mcp: { asset: 'brain-mcp.bundle.min.mjs', sha256: createHash('sha256').update(mcp).digest('hex') },
            reddb: { ...reddb, sdk, assets: redAssets },
          };
          writeFileSync('../../dist/brain-runtime-manifest.json', JSON.stringify(manifest, null, 2));
          console.log('brain runtime manifest:', JSON.stringify(manifest));
          EOF

      # ADR 0034: the code-nav MCP server ships as a release-asset bundle, like
      # the dev/memory runtimes. Its package lives under apps/code-nav.
      # `build` (typecheck + bundle) emits the dev-checkout
      # file dist/code-nav-mcp.bundle.min.mjs; the release asset the dynamic fetch
      # resolves is named code-nav.bundle.min.mjs (bundleAssetName('code-nav')),
      # with a code-nav.manifest.json mirroring dev.manifest.json.
      - name: Build code-nav MCP bundle + manifest
        if: steps.fleet.outputs.running == '0' && steps.bump.outputs.kind != 'none'
        working-directory: apps/code-nav
        env:
          NEXT: ${{ steps.version.outputs.next }}
          RED_BUILD_VERSION: ${{ steps.version.outputs.next }}
          RED_BUILD_GIT_SHA: ${{ github.sha }}
          RED_BUILD_TIME: ${{ github.event.head_commit.timestamp }}
        run: |
          set -euo pipefail
          pnpm typecheck
          pnpm bundle
          node --input-type=module <<'EOF'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync, copyFileSync } from 'node:fs';
          const built = '../../dist/code-nav-mcp.bundle.min.mjs';
          // Publish the fetch-resolvable asset name code-nav.bundle.min.mjs.
          const asset = '../../dist/code-nav.bundle.min.mjs';
          copyFileSync(built, asset);
          const bytes = readFileSync(asset);
          const manifest = {
            plugin: 'code-nav',
            version: process.env.NEXT.replace(/^v/, ''),
            sha256: createHash('sha256').update(bytes).digest('hex'),
          };
          writeFileSync('../../dist/code-nav.manifest.json', JSON.stringify(manifest, null, 2));
          console.log('code-nav bundle manifest:', JSON.stringify(manifest));
          EOF

      - name: Build benchmark-memory bundle + manifest
        if: steps.fleet.outputs.running == '0' && steps.bump.outputs.kind != 'none'
        working-directory: apps/benchmark-memory
        env:
          NEXT: ${{ steps.version.outputs.next }}
          RED_BUILD_VERSION: ${{ steps.version.outputs.next }}
          RED_BUILD_GIT_SHA: ${{ github.sha }}
          RED_BUILD_TIME: ${{ github.event.head_commit.timestamp }}
        run: |
          set -euo pipefail
          pnpm build
          node --input-type=module <<'EOF'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const asset = '../../dist/benchmark-memory.bundle.min.mjs';
          const bytes = readFileSync(asset);
          const manifest = {
            plugin: 'benchmark-memory',
            version: process.env.NEXT.replace(/^v/, ''),
            sha256: createHash('sha256').update(bytes).digest('hex'),
          };
          writeFileSync('../../dist/benchmark-memory.manifest.json', JSON.stringify(manifest, null, 2));
          console.log('benchmark-memory bundle manifest:', JSON.stringify(manifest));
          EOF

      - name: Build OpenCode host installer bundle
        if: steps.fleet.outputs.running == '0' && steps.bump.outputs.kind != 'none'
        working-directory: apps/opencode-host
        env:
          RED_BUILD_VERSION: ${{ steps.version.outputs.next }}
          RED_BUILD_GIT_SHA: ${{ github.sha }}
          RED_BUILD_TIME: ${{ github.event.head_commit.timestamp }}
        run: |
          set -euo pipefail
          pnpm build

      - name: Build benchmark-code-understanding bundle + manifest
        if: steps.fleet.outputs.running == '0' && steps.bump.outputs.kind != 'none'
        working-directory: apps/benchmark-code-understanding
        env:
          NEXT: ${{ steps.version.outputs.next }}
          RED_BUILD_VERSION: ${{ steps.version.outputs.next }}
          RED_BUILD_GIT_SHA: ${{ github.sha }}
          RED_BUILD_TIME: ${{ github.event.head_commit.timestamp }}
        run: |
          set -euo pipefail
          pnpm build
          node --input-type=module <<'EOF'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const asset = '../../dist/benchmark-code-understanding.bundle.min.mjs';
          const bytes = readFileSync(asset);
          const manifest = {
            plugin: 'benchmark-code-understanding',
            version: process.env.NEXT.replace(/^v/, ''),
            sha256: createHash('sha256').update(bytes).digest('hex'),
          };
          writeFileSync('../../dist/benchmark-code-understanding.manifest.json', JSON.stringify(manifest, null, 2));
          console.log('benchmark-code-understanding bundle manifest:', JSON.stringify(manifest));
          EOF

      # ADR 0091: npm is the ONLY client transport. Stage the built bundles into
      # the packaging/npm package, pnpm pack it, then run the REAL client resolver
      # (the packaged bin) against the packed tarball as a producer/consumer
      # contract check BEFORE publishing. A broken tarball fails the release here
      # rather than shipping.
      - name: Pack npm package + producer/consumer contract check
        if: steps.fleet.outputs.running == '0' && steps.bump.outputs.kind != 'none'
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          version="${NEXT#v}"
          # Pin the package version to the release version (2.0.0+).
          node -e "const fs=require('fs');const p='packaging/npm/package.json';const j=JSON.parse(fs.readFileSync(p));j.version=process.env.NEXT.replace(/^v/,'');fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');"
          # Stage the platform-independent JS bundles into the package's dist/.
          node packaging/npm/scripts/prepare.mjs
          cd packaging/npm
          pnpm pack --pack-destination .
          tarball="$(ls reddb-io-red-skills-*.tgz | head -n1)"
          echo "packed $tarball"
          # Contract check: install the packed tarball into a throwaway prefix and
          # run the REAL packaged client (the bin the launcher execs) — proves the
          # tarball resolves and runs before we publish it.
          smoke="$(mktemp -d)"
          npm install "./$tarball" --prefix "$smoke" --no-audit --no-fund --ignore-scripts --loglevel=error
          node "$smoke/node_modules/@reddb-io/red-skills/bin/red-skills-dev.mjs" --version
          rm -rf "$smoke"

      - name: Publish to npm (guarded)
        if: steps.fleet.outputs.running == '0' && steps.bump.outputs.kind != 'none'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::warning::NPM_TOKEN secret absent — skipping npm publish of @reddb-io/red-skills@${NEXT#v}"
            exit 0
          fi
          # canary channel → npm `canary` dist-tag; stable → `latest` (default).
          tag_args=()
          case "${NEXT#v}" in
            *-*) tag_args=(--tag canary) ;;
          esac
          cd packaging/npm
          npm config set //registry.npmjs.org/:_authToken "${NODE_AUTH_TOKEN}"
          pnpm publish --access public --no-git-checks "${tag_args[@]}"

      - name: Build release manifest
        if: steps.fleet.outputs.running == '0' && steps.bump.outputs.kind != 'none'
        env:
          RED_RELEASE_VERSION: ${{ steps.version.outputs.next }}
          RED_RELEASE_GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/release-manifest.mjs \
            dist/dev.bundle.min.mjs \
            dist/dev.manifest.json \
            dist/code-nav.bundle.min.mjs \
            dist/code-nav.manifest.json \
            dist/benchmark-memory.bundle.min.mjs \
            dist/benchmark-memory.manifest.json \
            dist/opencode-host.bundle.min.mjs \
            dist/benchmark-code-understanding.bundle.min.mjs \
            dist/benchmark-code-understanding.manifest.json \
            dist/memory.bundle.min.mjs \
            dist/memory-mcp.bundle.min.mjs \
            dist/memory-runtime-manifest.json \
            dist/brain.bundle.min.mjs \
            dist/brain-mcp.bundle.min.mjs \
            dist/brain-runtime-manifest.json

      - name: Tag + GitHub Release
        if: steps.fleet.outputs.running == '0' && steps.bump.outputs.kind != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.version.outputs.next }}
          PREVIOUS: ${{ steps.bump.outputs.previous }}
        run: |
          set -euo pipefail
          major="v${NEXT#v}"
          major="${major%%.*}"

          git tag -a "$NEXT" -m "Release $NEXT"
          git push origin "$NEXT"
          # ADR 0091: the client resolves bundles over npm; these Release assets
          # are kept as an INERT backup artifact the client never reads. No
          # sigstore signatures are uploaded (client signature verification
          # removed).
          assets=(
            dist/dev.bundle.min.mjs
            dist/dev.manifest.json
            dist/code-nav.bundle.min.mjs
            dist/code-nav.manifest.json
            dist/benchmark-memory.bundle.min.mjs
            dist/benchmark-memory.manifest.json
            dist/opencode-host.bundle.min.mjs
            dist/benchmark-code-understanding.bundle.min.mjs
            dist/benchmark-code-understanding.manifest.json
            dist/memory.bundle.min.mjs
            dist/memory-mcp.bundle.min.mjs
            dist/memory-runtime-manifest.json
            dist/brain.bundle.min.mjs
            dist/brain-mcp.bundle.min.mjs
            dist/brain-runtime-manifest.json
            dist/release-manifest.json
          )
          if [ -n "$PREVIOUS" ]; then
            gh release create "$NEXT" "${assets[@]}" \
              --title "$NEXT" \
              --generate-notes \
              --notes-start-tag "$PREVIOUS"
          else
            gh release create "$NEXT" "${assets[@]}" \
              --title "$NEXT" \
              --generate-notes
          fi

          # `vX.Y.Z` is immutable release history; `vX` is the moving major ref
          # GitHub reusable workflows/actions consume via `uses: ...@vX`.
          git tag -f "$major" HEAD
          git push --force origin "refs/tags/$major:refs/tags/$major"
