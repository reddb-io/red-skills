name: red-release

# Maintain the Version Packages PR (ADR 0121).
#
# This workflow decides *what the next version is*; it never publishes and it
# never pushes to main. Every push to main it:
#
#   1. Collects the pending changesets under .changeset/.
#   2. Runs `pnpm release:version` (changeset version + scripts/sync-version.mjs)
#      on a release branch and opens/updates the "chore(release): version
#      packages" PR against main through the PAT-backed release identity. That
#      PR passes branch protection exactly like any human PR — no admin bypass,
#      no GH006 fallback, no direct push.
#   3. When the Version Packages PR itself merges, main arrives here with ZERO
#      pending changesets and a version no tag points at yet. That is the cut
#      signal: tag `vX.Y.Z` and hand off to red-publish.yml, which owns the
#      bundles, the npm publish, and the GitHub Release.
#
# Why the explicit `gh workflow run` handoff: a tag pushed with GITHUB_TOKEN
# does NOT start a workflow run (GitHub suppresses recursive triggers), so the
# `on: push: tags` trigger in red-publish.yml would never fire for the automated
# cut. Dispatching it by name makes the automated path immediate while a tag
# pushed by a human still triggers the same workflow the advertised way.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: red-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.cut.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          # THE PUSH IDENTITY, and it is not the same thing as the API identity.
          # `actions/checkout` persists whatever token it is given as the git
          # credential, defaulting to GITHUB_TOKEN — so a workflow can hold a PAT,
          # spend it on every API call, open the PR as the PAT identity, and still
          # PUSH as `github-actions[bot]`. GitHub's anti-recursion guard watches
          # the push, not the API call, which parks every `pull_request` run in
          # `action_required`.
          #
          # #3168 moved the PAT to the action's `github-token` input and the PR
          # author changed to the PAT identity — so the repair looked complete
          # while the commit stayed bot-authored and the runs kept parking. Both
          # halves are needed: this line owns the push, `github-token` owns the API.
          token: ${{ secrets.RELEASE_PAT }}
          fetch-depth: 0
          fetch-tags: true

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install workspace dependencies
        env:
          # Versioning touches manifests only; it never runs the @reddb-io/sdk
          # backed runtimes, so the postinstall binary download is dead weight
          # and an unavailable reddb asset must not block a version PR.
          REDDB_SKIP_POSTINSTALL: "1"
        run: pnpm install --frozen-lockfile

      # Guard the invariant before proposing a bump: if the checkout is already
      # drifted, `changeset version` would bake the drift into the release PR.
      - name: Check version sync
        run: pnpm version:sync:check

      - name: Maintain the Version Packages PR
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d
        with:
          # THE INPUT, not the env var. A GITHUB_TOKEN-authored push leaves
          # `pull_request` runs parked in `action_required` — GitHub's
          # anti-recursion guard — so the release PR sits BLOCKED on required
          # checks that never start. The PAT identity is what makes them start.
          #
          # This action's `github-token` input defaults to `${{ github.token }}`,
          # so setting only `env.GITHUB_TOKEN` left the PAT present, valid and
          # UNUSED: the step logged both `github-token: ***` and `GITHUB_TOKEN:
          # ***`, authenticated with the first, and pushed as `github-actions[bot]`.
          # Fifteen runs parked across three commits on 2026-08-03 that way, and
          # publishing stopped for over half an hour with every check green.
          github-token: ${{ secrets.RELEASE_PAT }}
          version: pnpm release:version
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
          setupGitUser: true
        env:
          # Kept for the action's own `changeset` subprocesses, which read the
          # environment rather than the input.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

      # The cut reads the version and the pending changesets out of the BUMP
      # COMMIT the push event named, never out of the checkout: a merge racing
      # onto main between the Version Packages PR merge and this run rewrites
      # `.changeset/`, which made the bump look un-merged and swallowed two tags
      # in silence (2026-08-01). Gating the step on the live
      # `hasChangesets` output reintroduces exactly that race, so the script —
      # not the `if:` — owns the decision, and every skip prints its reason.
      - name: Cut the release tag
        id: cut
        env:
          BUMP_SHA: ${{ github.sha }}
        run: scripts/release-cut-tag.sh

      - name: Dispatch red-publish
        if: steps.cut.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.cut.outputs.tag }}
        # See the header: a GITHUB_TOKEN tag push cannot trigger `on: push:
        # tags`, so start the publish workflow explicitly.
        run: gh workflow run red-publish.yml --ref main -f tag="$TAG"
