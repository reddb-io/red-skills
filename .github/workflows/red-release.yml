name: red-release

# Auto-release on push to main:
#   1. Defer if any open issue carries the `running` label (a /afk fleet is
#      mid-iteration — auto-pushing a release commit would yank origin/main
#      out from under in-flight workers, causing merge-conflict cascades).
#   2. Parse conventional commits since the last vX.Y.Z tag.
#      - BREAKING CHANGE / `feat!:` / `fix!:` → major bump
#      - `feat:`                              → minor bump
#      - anything else (`fix:`, `chore:`, …) → patch bump
#      - no `feat`/`fix`/`!` commits          → skip (no release)
#   3. Sync plugins/dev/.claude-plugin/plugin.json `version` field.
#   4. Commit the bump back to main (marker `[skip release]` to avoid loop).
#   5. Create the git tag and a GitHub Release with auto-generated notes.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: red-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Defer if /afk fleet is active
        id: fleet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          running=$(gh issue list --label running --state open --json number --jq 'length' 2>/dev/null || echo "0")
          echo "running=$running" >> "$GITHUB_OUTPUT"
          if [ "$running" -gt 0 ]; then
            echo "::notice::🛑 fleet active — $running issue(s) carry the 'running' label. Release deferred; the fleet's next push to main after the running issues drain will retry."
          else
            echo "no running issues — proceeding"
          fi

      - name: Validate install metadata
        if: steps.fleet.outputs.running == '0'
        run: scripts/validate-install-metadata.sh

      - name: Test agent metadata fixtures
        if: steps.fleet.outputs.running == '0'
        run: scripts/test-validate-agent-metadata.sh

      - name: Test AFK task contract fixtures
        if: steps.fleet.outputs.running == '0'
        run: scripts/test-validate-afk-task-contract.sh

      - name: Test issue-analyzer contract fixtures
        if: steps.fleet.outputs.running == '0'
        run: scripts/test-validate-issue-analyzer-contract.sh

      - name: Test task-executor contract fixtures
        if: steps.fleet.outputs.running == '0'
        run: scripts/test-validate-task-executor-contract.sh

      - name: Test quality-gate contract fixtures
        if: steps.fleet.outputs.running == '0'
        run: scripts/test-validate-quality-gate-contract.sh

      - name: Decide bump kind
        id: bump
        if: steps.fleet.outputs.running == '0'
        run: |
          set -euo pipefail
          latest=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            range="HEAD"
          else
            range="${latest}..HEAD"
          fi
          subjects=$(git log "$range" --format='%s%n%b' || true)

          kind="none"
          if grep -qE '(^|\n)(feat|fix)!:|BREAKING CHANGE' <<<"$subjects"; then
            kind="major"
          elif grep -qE '(^|\n)feat(\([^)]*\))?:' <<<"$subjects"; then
            kind="minor"
          elif grep -qE '(^|\n)fix(\([^)]*\))?:' <<<"$subjects"; then
            kind="patch"
          fi

          echo "previous=$latest" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "Bump kind: $kind (previous tag: ${latest:-none})"

      - name: Skip if no releasable commits
        if: steps.fleet.outputs.running == '0' && steps.bump.outputs.kind == 'none'
        run: |
          echo "No feat/fix commits since ${{ steps.bump.outputs.previous }} — nothing to release."

      - name: Compute next version
        id: version
        if: steps.fleet.outputs.running == '0' && steps.bump.outputs.kind != 'none'
        env:
          KIND: ${{ steps.bump.outputs.kind }}
          PREVIOUS: ${{ steps.bump.outputs.previous }}
        run: |
          set -euo pipefail
          if [ -z "$PREVIOUS" ]; then
            next="v0.1.0"
          else
            IFS='.' read -r major minor patch <<<"${PREVIOUS#v}"
            case "$KIND" in
              major) next="v$((major + 1)).0.0" ;;
              minor) next="v${major}.$((minor + 1)).0" ;;
              patch) next="v${major}.${minor}.$((patch + 1))" ;;
            esac
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Releasing $next"

      - uses: pnpm/action-setup@v4
        if: steps.fleet.outputs.running == '0' && steps.bump.outputs.kind != 'none'
        with:
          version: 11

      - uses: actions/setup-node@v4
        if: steps.fleet.outputs.running == '0' && steps.bump.outputs.kind != 'none'
        with:
          node-version: 22

      # ADR 0032: AFK ships as a committed, dependency-free bundle. Rebuild it
      # from src/domains/dev (which lives outside the plugin tree) so the shipped
      # bin/afk.mjs is always byte-for-byte the build of the released source,
      # then stage it into the version-bump commit below. esbuild output is
      # deterministic, so unchanged source rebuilds to identical bytes and the
      # git add is a no-op.
      - name: Build AFK runtime bundle
        if: steps.fleet.outputs.running == '0' && steps.bump.outputs.kind != 'none'
        working-directory: src/domains/dev
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          # The dev bundle imports ../../shared/args.ts, and esbuild resolves its
          # `cli-args-parser` dep from src/shared's OWN node_modules (ADR 0034
          # self-contained shared package), not from src/domains/dev. Install it too,
          # or the bundle fails with "Could not resolve cli-args-parser".
          pnpm -C ../../shared install --frozen-lockfile
          # `build` emits the canonical dist/dev.bundle.min.mjs (release asset,
          # ADR 0034) plus the transition bin/afk.mjs staged below.
          pnpm build
          # The dynamic fetcher (src/shared/fetch-cli.ts) bootstraps every other
          # bundle but cannot fetch itself, so it ships COMMITTED in the dev plugin
          # (like memory's bootstrap.mjs). Rebuild it here from source so the shipped
          # plugins/dev/hooks/red-fetch.mjs always matches src/shared/fetch-cli.ts,
          # then stage it into the version-bump commit below (esbuild is
          # deterministic, so an unchanged source rebuilds to identical bytes).
          ./node_modules/.bin/esbuild ../../shared/fetch-cli.ts \
            --bundle --minify --platform=node --format=esm --target=node22 \
            --outfile=../../../plugins/dev/hooks/red-fetch.mjs \
            --banner:js="import { createRequire as __cr } from 'node:module'; const require = __cr(import.meta.url);"
          # Checksum manifest the dynamic-fetch hook (src/shared/bundle-fetch.ts)
          # verifies before caching. Mirrors memory-runtime-manifest.json.
          node --input-type=module <<'EOF'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const bytes = readFileSync('../../../dist/dev.bundle.min.mjs');
          const manifest = {
            plugin: 'dev',
            version: process.env.NEXT.replace(/^v/, ''),
            sha256: createHash('sha256').update(bytes).digest('hex'),
          };
          writeFileSync('../../../dist/dev.manifest.json', JSON.stringify(manifest, null, 2));
          console.log('dev runtime manifest:', JSON.stringify(manifest));
          EOF

      - name: Sync plugin manifest versions
        if: steps.fleet.outputs.running == '0' && steps.bump.outputs.kind != 'none'
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          manifests=(
            plugins/dev/.claude-plugin/plugin.json
            plugins/dev/.codex-plugin/plugin.json
            plugins/memory/.claude-plugin/plugin.json
            plugins/memory/.codex-plugin/plugin.json
          )
          afk_bundle=plugins/dev/skills/engineering/afk/bin/afk.mjs
          fetch_bundle=plugins/dev/hooks/red-fetch.mjs
          new="${NEXT#v}"
          for manifest in "${manifests[@]}"; do
            tmp=$(mktemp)
            jq --arg v "$new" '.version = $v' "$manifest" > "$tmp"
            mv "$tmp" "$manifest"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- "${manifests[@]}" "$afk_bundle" "$fetch_bundle"; then
            echo "plugin manifests already at $new and AFK + red-fetch bundles unchanged"
          else
            git add "${manifests[@]}" "$afk_bundle" "$fetch_bundle"
            git commit -m "chore(release): $NEXT [skip release]"
            # Rebase-resilient push: red-memory-wiki-extract.yml also pushes to
            # main on PR-merge (via GITHUB_TOKEN, which can't re-trigger this
            # workflow), so the bump push races it and loses on a plain push.
            # Retry with a rebase so a concurrent push never wedges the release.
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              echo "push rejected (attempt $attempt) — rebasing onto origin/main"
              git fetch origin main
              git rebase origin/main
            done
          fi

      # ADR 0029: the Memory runtime ships as release assets, not committed
      # build output. esbuild bundles the CLI (all JS deps inlined) into one
      # platform-independent file; a manifest pins its checksum + the reddb tag
      # whose per-platform `red` binaries the bootstrap reuses. Assets are
      # attached at `gh release create` so they exist the moment the Release
      # publishes. pnpm/node are already set up above for the AFK bundle.
      - name: Build memory runtime bundle + manifest
        if: steps.fleet.outputs.running == '0' && steps.bump.outputs.kind != 'none'
        working-directory: src/domains/memory
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          # bundle:legacy keeps emitting dist-bundle/memory-cli.mjs the manifest +
          # current bootstrap expect (ADR 0029). The new canonical
          # dist/memory.bundle.min.mjs (ADR 0034) is built by `pnpm bundle`; both
          # asset models coexist until the dynamic-fetch phase unifies them.
          pnpm bundle:legacy
          # The /curate skill resolves red-curate-skill via the dynamic fetcher
          # (red-fetch), which requests the canonical asset name
          # red-curate-skill.bundle.min.mjs + a red-curate-skill.manifest.json
          # (bundleAssetName/manifestAssetName('red-curate-skill')). Build that
          # canonical bundle and its checksum manifest so the cache install can
          # resolve it; the legacy dist-bundle/red-curate-skill.mjs stays for the
          # published-bin path until both asset models unify.
          pnpm bundle:curate-skill
          node --input-type=module <<'EOF'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const bytes = readFileSync('../../../dist/red-curate-skill.bundle.min.mjs');
          const manifest = {
            plugin: 'red-curate-skill',
            version: process.env.NEXT.replace(/^v/, ''),
            sha256: createHash('sha256').update(bytes).digest('hex'),
          };
          writeFileSync('../../../dist/red-curate-skill.manifest.json', JSON.stringify(manifest, null, 2));
          console.log('red-curate-skill bundle manifest:', JSON.stringify(manifest));
          EOF
          node --input-type=module <<'EOF'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const sdk = pkg.dependencies['@reddb-io/sdk'];
          const cli = readFileSync('dist-bundle/memory-cli.mjs');
          const manifest = {
            schema: 'red.memory.runtime.v1',
            version: process.env.NEXT.replace(/^v/, ''),
            cli: { asset: 'memory-cli.mjs', sha256: createHash('sha256').update(cli).digest('hex') },
            reddb: {
              repo: 'reddb-io/reddb',
              tag: `v${sdk}`,
              assets: {
                'linux-x86_64': 'red-linux-x86_64',
                'linux-aarch64': 'red-linux-aarch64',
                'linux-armv7': 'red-linux-armv7',
                'macos-x86_64': 'red-macos-x86_64',
                'macos-aarch64': 'red-macos-aarch64',
                'windows-x86_64': 'red-windows-x86_64.exe',
              },
            },
          };
          writeFileSync('memory-runtime-manifest.json', JSON.stringify(manifest, null, 2));
          console.log('runtime manifest:', JSON.stringify(manifest));
          EOF

      # ADR 0034: the code-nav MCP server ships as a release-asset bundle, like
      # the dev/memory runtimes. Its package lives inside the dev domain tree but
      # is a self-contained package (own pnpm-lock), so it installs in isolation
      # with --ignore-workspace. `build` (typecheck + bundle) emits the dev-checkout
      # file dist/code-nav-mcp.bundle.min.mjs; the release asset the dynamic fetch
      # resolves is named code-nav.bundle.min.mjs (bundleAssetName('code-nav')),
      # with a code-nav.manifest.json mirroring dev.manifest.json.
      - name: Build code-nav MCP bundle + manifest
        if: steps.fleet.outputs.running == '0' && steps.bump.outputs.kind != 'none'
        working-directory: src/domains/dev/mcp/code-nav
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          # code-nav is its own pnpm workspace root (packages: [.]), so a plain
          # install isolates it from the parent dev workspace without
          # --ignore-workspace. Build with direct binaries — `pnpm run` triggers a
          # deps-status precheck that re-resolves the parent workspace and fails.
          # strictDepBuilds=false: esbuild ships its platform binary via an optional
          # dep, so its skipped postinstall must not fail the install under set -e.
          pnpm install --frozen-lockfile --config.strictDepBuilds=false
          ./node_modules/.bin/tsc -p tsconfig.json --noEmit
          ./node_modules/.bin/esbuild src/index.ts --bundle --minify --platform=node --format=esm --target=node22 --outfile=../../../../../dist/code-nav-mcp.bundle.min.mjs --banner:js="import { createRequire as __cr } from 'node:module'; const require = __cr(import.meta.url);"
          node --input-type=module <<'EOF'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync, copyFileSync } from 'node:fs';
          const built = '../../../../../dist/code-nav-mcp.bundle.min.mjs';
          // Publish the fetch-resolvable asset name code-nav.bundle.min.mjs.
          const asset = '../../../../../dist/code-nav.bundle.min.mjs';
          copyFileSync(built, asset);
          const bytes = readFileSync(asset);
          const manifest = {
            plugin: 'code-nav',
            version: process.env.NEXT.replace(/^v/, ''),
            sha256: createHash('sha256').update(bytes).digest('hex'),
          };
          writeFileSync('../../../../../dist/code-nav.manifest.json', JSON.stringify(manifest, null, 2));
          console.log('code-nav bundle manifest:', JSON.stringify(manifest));
          EOF

      - name: Tag + GitHub Release
        if: steps.fleet.outputs.running == '0' && steps.bump.outputs.kind != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.version.outputs.next }}
          PREVIOUS: ${{ steps.bump.outputs.previous }}
        run: |
          set -euo pipefail
          git tag -a "$NEXT" -m "Release $NEXT"
          git push origin "$NEXT"
          assets=(
            dist/dev.bundle.min.mjs
            dist/dev.manifest.json
            dist/code-nav.bundle.min.mjs
            dist/code-nav.manifest.json
            dist/red-curate-skill.bundle.min.mjs
            dist/red-curate-skill.manifest.json
            src/domains/memory/dist-bundle/memory-cli.mjs
            src/domains/memory/dist-bundle/memory-mcp.mjs
            src/domains/memory/dist-bundle/red-curate-skill.mjs
            src/domains/memory/memory-runtime-manifest.json
          )
          if [ -n "$PREVIOUS" ]; then
            gh release create "$NEXT" "${assets[@]}" \
              --title "$NEXT" \
              --generate-notes \
              --notes-start-tag "$PREVIOUS"
          else
            gh release create "$NEXT" "${assets[@]}" \
              --title "$NEXT" \
              --generate-notes
          fi
