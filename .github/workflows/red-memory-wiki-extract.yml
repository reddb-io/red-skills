# Auto-publish a wiki page for every merged PR (PRD #217, slice #219).
#
# Trigger: pull_request.closed — the per-job `if` ensures we only run when
# the close was a merge, never on a plain close-without-merge.
#
# Steps:
#   1. Checkout main with write token (auto-checkout is detached at the merge
#      SHA; we want to push back to main).
#   2. Fetch PR data via `gh pr view --json …` to a local JSON file.
#   3. Generate the page deterministically from PR data
#      (scripts/memory-wiki-extract-from-pr.sh).
#   4. Regenerate the wiki index from pages/
#      (scripts/memory-wiki-regen-index.sh).
#   5. Force-add the generated paths (`.red/wiki/` is in `.gitignore` so that
#      local manual wiki notes stay private; auto-generated content opts in
#      explicitly via `git add -f`).
#   6. Commit with marker `[memory] wiki extract for #<pr>` and push to main.
#      Skip the push if the diff is empty so re-runs for a PR that produced
#      no changes don't pollute history.
#
# Wiki-only by design: this workflow does not invoke any memory CLI and does
# not touch the local RedDB graph store (per PRD #217 decision).

name: red-memory-wiki-extract

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: red-memory-wiki-extract-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  extract:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch PR data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr view "$PR_NUMBER" \
            --json title,body,author,mergeCommit,url,files,commits \
            > pr-data.json

      - name: Generate wiki page
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          chmod +x scripts/memory-wiki-extract-from-pr.sh
          scripts/memory-wiki-extract-from-pr.sh \
            --pr-number "$PR_NUMBER" \
            --pr-data pr-data.json

      - name: Regenerate wiki index
        run: |
          set -euo pipefail
          chmod +x scripts/memory-wiki-regen-index.sh
          scripts/memory-wiki-regen-index.sh

      - name: Commit and push
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # `.red/wiki/` is gitignored to keep local manual notes private; the
          # workflow opts in explicitly via -f for the auto-generated paths only.
          git add -f .red/wiki/pages .red/wiki/index.md

          if git diff --cached --quiet; then
            echo "no wiki changes for PR #$PR_NUMBER — nothing to commit"
            exit 0
          fi

          git commit -m "[memory] wiki extract for #${PR_NUMBER}"
          git push origin HEAD:main
