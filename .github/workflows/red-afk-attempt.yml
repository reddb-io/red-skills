# Reusable workflow: red-afk-attempt
#
# This is the AFK Actions lane (ADR 0059, glossary term) for any GitHub
# repository that installs RedSkills. It runs ONE attempt per invocation
# against the executable issue given by the caller — no fleet, no
# admin-merge in CI. The PR is the deliverable; the merge decision stays
# human.
#
# Trigger surfaces, all in the same file:
#
#   1. `workflow_call`     — direct invocation by a caller workflow.
#   2. `workflow_dispatch` — manual run from the Actions UI, `issue_number` input.
#
# The `issues: [labeled, opened]` auto-trigger was intentionally removed so the
# lane stays dispatch/call-only while no auth secrets are configured (it was
# firing — and failing at auth — on every `ready-for-agent` issue). Re-add it
# (the `on:` trigger + the two `issues`-event branches in the job `if:`) once the
# MINIMAX / OPENAI / OPENROUTER secrets are set.
#
# Per ADR 0056, the trust gate is rigorous by default: the issue author AND the
# label-applier (the opener, for the `opened` path) must both be in the
# allowlist. The gate is evaluated with `actions/github-script@v7`. Failure →
# no claim, no PR, logged reason + a comment.
#
# Execution is delegated to the repo-portable composite action
# `reddb-io/red-skills/.github/actions/afk-attempt` (ADR 0062): it sets up Node,
# installs the selected runner CLI, and runs the version-pinned AFK launcher
# (`afk.mjs`), which fetches the prebuilt `dev` bundle from the matching GitHub
# Release (ADR 0038/0039) — no workspace build, no submodule needed in CI. This
# workflow owns only the triggers + the trust gate (the policy layer).
#
# Adoption paths:
#   - Path A (auto, simplest): install this workflow directly into the adopter
#     repo and edit the `allowlist_*` defaults below. Fires on issues:labeled/opened.
#   - Path B (caller, more control): copy the thin caller at
#     `plugins/dev/skills/engineering/afk/examples/red-afk-attempt-caller.yml`.
#
# Required `permissions:` are intentionally minimal — `contents: write` (push
# worker branch), `issues: write` (envelope + labels), `pull-requests: write`
# (open PR). No `id-token`, no `actions: write`.

name: red-afk-attempt

on:
  workflow_call:
    inputs:
      issue_number:
        description: "Issue number to process. Empty string = no-op."
        required: false
        type: string
        default: ""
      runner:
        description: "AFK runner to drive (claude|codex|opencode)."
        required: false
        type: string
        default: "opencode"
      model:
        description: "Override the model for every tier (e.g. minimax/MiniMax-M2). Empty = read from `.red/config.yaml` / defaults. Maps to RED_AFK_MODEL."
        required: false
        type: string
        default: ""
      effort:
        description: "Override the reasoning effort/variant. Empty = config. Maps to RED_AFK_EFFORT (still provider-gated)."
        required: false
        type: string
        default: ""
      allowlist_authors:
        description: "CSV of GitHub logins allowed as issue author."
        required: true
        type: string
      allowlist_label_actors:
        description: "CSV of GitHub logins allowed as label-applier (sender)."
        required: true
        type: string
      enforce_trust_gate:
        description: "Refuse to claim if author/actor not in allowlist. Default true."
        required: false
        type: string
        default: "true"
      lanes:
        description: "Execution-lane tag for this invocation (e.g. actions|k8s). Surfaced as RED_AFK_LANE for observability/forward-compat; does not change the runtime contract (one attempt, one issue, one PR)."
        required: false
        type: string
        default: "actions"
    secrets:
      openrouter_api_key:
        required: false
      minimax_api_key:
        required: false
      openai_api_key:
        required: false
      anthropic_api_key:
        required: false

  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to process (e.g. 631)."
        required: true
        type: string
      runner:
        description: "AFK runner to drive (claude|codex|opencode)."
        required: false
        type: string
        default: "opencode"
      model:
        description: "Override the model for every tier (e.g. minimax/MiniMax-M2). Empty = config."
        required: false
        type: string
        default: ""

  # NOTE: the `issues: [labeled, opened]` auto-trigger was intentionally removed —
  # the lane is dispatch/call-only until auth secrets are configured (see the job
  # `if:` below for how to restore auto-firing).

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  attempt:
    # Manual / programmatic dispatch only. The `issues:` auto-trigger was removed
    # so the lane no longer fires (and fails) on every `ready-for-agent` issue
    # while no auth secrets are configured. To restore auto-firing once secrets
    # (MINIMAX / OPENAI / OPENROUTER) are set: re-add `issues: types: [labeled,
    # opened]` to `on:` above, and the two `issues`-event branches to this `if:`.
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'workflow_call')
    runs-on: ubuntu-latest
    # Resolve the runner once for every step. issues:* events have no host
    # session, so they always use opencode (the API-auth runner, ADR 0059).
    env:
      RED_AFK_RUNNER: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.runner || 'opencode' }}
    steps:
      - name: Resolve the issue number
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const eventName = context.eventName;
            let issueNumber = '';
            if (eventName === 'workflow_dispatch') {
              issueNumber = context.payload.inputs.issue_number;
            } else if (eventName === 'workflow_call') {
              issueNumber = context.payload.inputs.issue_number || context.payload.issue_number || '';
            } else if (eventName === 'issues') {
              issueNumber = String(context.payload.issue.number);
            }
            if (!/^[0-9]+$/.test(issueNumber)) {
              core.setFailed(`invalid issue number: ${JSON.stringify(issueNumber)}`);
              return;
            }
            core.info(`resolved issue_number=${issueNumber} from event=${eventName}`);
            core.setOutput('number', issueNumber);

      - name: Evaluate the trust gate
        id: trust
        uses: actions/github-script@v7
        env:
          ENFORCE_TRUST_GATE: ${{ github.event_name == 'workflow_call' && inputs.enforce_trust_gate || 'true' }}
          ALLOWLIST_AUTHORS: ${{ github.event_name == 'workflow_call' && inputs.allowlist_authors || '' }}
          ALLOWLIST_LABEL_ACTORS: ${{ github.event_name == 'workflow_call' && inputs.allowlist_label_actors || '' }}
        with:
          script: |
            const enforce = (process.env.ENFORCE_TRUST_GATE || 'true').toLowerCase() !== 'false';
            const authors = (process.env.ALLOWLIST_AUTHORS || '').split(',').map(s => s.trim()).filter(Boolean);
            const labelActors = (process.env.ALLOWLIST_LABEL_ACTORS || '').split(',').map(s => s.trim()).filter(Boolean);

            // For the issues trigger, fall back to a hard-coded allowlist of
            // reddb-io maintainers (this workflow lives in reddb-io/red-skills).
            // TODO: when #621 lands, source the allowlist from `.red/config.yaml`
            // (`plugins.dev.afk.trust_gate.allowlist`) and remove this fallback.
            if (authors.length === 0) {
              authors.push('filipeforattini');
            }
            if (labelActors.length === 0) {
              labelActors.push('filipeforattini');
            }

            const eventName = context.eventName;
            const issue = context.payload.issue;
            const sender = context.payload.sender;
            const author = issue?.user?.login;
            // issues:opened — the opener is the de-facto label-applier (the issue
            // was filed pre-labeled), so the sender (== author) is the actor.
            const labelActor = eventName === 'issues' ? sender?.login : (sender?.login || author);

            const authorOk = authors.includes(author);
            const actorOk  = labelActors.includes(labelActor);
            const ok = authorOk && actorOk;

            core.info(`trust-gate: enforce=${enforce} author=${author} actor=${labelActor} author_ok=${authorOk} actor_ok=${actorOk}`);

            if (!enforce) {
              core.warning('trust gate DISABLED (enforce_trust_gate=false); claiming without allowlist check');
              core.setOutput('gate', 'bypass');
            } else if (ok) {
              core.setOutput('gate', 'pass');
            } else {
              core.setOutput('gate', 'fail');
              const reason = `trust gate failed: author=${author} in ${JSON.stringify(authors)} = ${authorOk}; label-actor=${labelActor} in ${JSON.stringify(labelActors)} = ${actorOk}`;
              core.notice(reason, { properties: { tag: 'trust-gate' } });
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  issue_number: parseInt(context.payload.issue.number, 10),
                  body: `🤖 /afk trust gate refused to claim this issue: ${reason}. See #621 for the allowlist predicate.`,
                });
              } catch (e) {
                core.warning(`failed to post trust-gate refusal comment: ${e.message}`);
              }
            }

      # Everything below runs only when the gate admits the claim.
      - name: Checkout the target repository
        if: steps.trust.outputs.gate == 'pass' || steps.trust.outputs.gate == 'bypass'
        uses: actions/checkout@v4
        with:
          # Pull submodules so a repo that vendors one as a workspace dependency
          # (e.g. red-skills' public `packages/red-castle`, ADR 0061) resolves in
          # the feedback gate's `pnpm` build. A no-op for adopter repos with no
          # submodule. actions/checkout rewrites `git@github.com:` submodule URLs
          # to token-https; a PUBLIC submodule then needs no extra credential.
          submodules: recursive

      # Execution is the repo-portable composite action (ADR 0062): it sets up
      # Node, installs the selected runner CLI, and runs the version-pinned
      # launcher (which fetches the dev bundle from the Release) against this
      # checkout. The action carries its own red-skills checkout, so the launcher
      # resolves even when this workflow runs in an adopter repo.
      # TODO: when #622 lands, the atomic claim CAS replaces the --issues <N>
      # direct invocation with a server-side claim that can't race a local fleet.
      - name: Run the AFK attempt
        if: steps.trust.outputs.gate == 'pass' || steps.trust.outputs.gate == 'bypass'
        uses: reddb-io/red-skills/.github/actions/afk-attempt@main
        with:
          issue: ${{ steps.resolve.outputs.number }}
          runner: ${{ env.RED_AFK_RUNNER }}
          # model/effort are caller inputs (workflow_call/dispatch); empty for the
          # issues triggers, which leaves the target repo's config in charge.
          model: ${{ inputs.model }}
          effort: ${{ inputs.effort }}
          lane: ${{ github.event_name == 'workflow_call' && inputs.lanes || 'actions' }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          minimax-api-key: ${{ secrets.MINIMAX_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
