# rs-afk-attempt — red-skills' OWN caller for the AFK Actions lane.
#
# Naming convention: reusable workflows are prefixed `reusable-*` (here, the
# reusable `reusable-afk-attempt.yml`). A workflow INSTALLED into a target repo to
# drive that lane is prefixed `rs-*` ("RedSkills-installed in this repo").
# This file is red-skills self-hosting its own lane, so it is `rs-*` too.
#
# It calls the LOCAL reusable (`./.github/workflows/reusable-afk-attempt.yml`) — the
# same one adopters reference as `reddb-io/red-skills/.github/workflows/reusable-afk-attempt.yml@v1`.
#
# Auth: opencode + the org-level `MINIMAX_API_KEY` secret. Model: minimax/MiniMax-M3.
# Trust gate: only issues authored AND labelled by an allowlisted login run.
#
# Runner: GitHub-hosted Ubuntu. Standard runners are free for this public
# repository, and the reusable already defaults to ubuntu-latest. Adopters can
# still pass a Blacksmith runner label when faster paid compute is intentional.

name: rs-afk-attempt

on:
  # Manual: process a specific issue from the Actions UI, OR leave it empty to
  # auto-pick the oldest open ready-for-agent issue.
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to process (e.g. 631). Leave EMPTY to auto-pick the oldest open ready-for-agent issue."
        required: false
        type: string
        default: ""
  # Auto: fire when an issue gains the ready-for-agent label.
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  attempt:
    # Dispatch always runs; the issues event only when the applied label is
    # exactly ready-for-agent (so other label edits do not spawn attempts).
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'ready-for-agent')
    uses: ./.github/workflows/reusable-afk-attempt.yml
    with:
      issue_number: ${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || github.event.issue.number }}
      runner: opencode
      model: minimax/MiniMax-M3
      runs_on: ubuntu-24.04
      enforce_trust_gate: ${{ 'true' }}
      allowlist_authors: "filipeforattini"
      allowlist_label_actors: "filipeforattini"
    secrets:
      minimax_api_key: ${{ secrets.MINIMAX_API_KEY }}
