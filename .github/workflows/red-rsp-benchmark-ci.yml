name: red-rsp-benchmark-ci

on:
  pull_request:
    paths:
      - apps/rsp/**
      - .github/workflows/red-rsp-benchmark-ci.yml
  push:
    # The red-toon-watch rolling PR (GITHUB_TOKEN-authored, never triggers
    # pull_request workflows) bumps TQ_VERSION here — run on its branch push
    # so the benchmark check lands on the head SHA.
    branches: [automation/toon-bump]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install pinned tq
        env:
          TQ_VERSION: v0.3.0
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/tq-install.sh"
          scripts/ci-fetch-with-retry.sh \
            "https://api.github.com/repos/reddb-io/toon/contents/install.sh?ref=${TQ_VERSION}" \
            "$installer" \
            -H "Accept: application/vnd.github.raw+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28"
          sh "$installer"

      - name: Install workspace dependencies
        env:
          REDDB_SKIP_POSTINSTALL: "1"
        run: pnpm install --frozen-lockfile

      - name: Check rsp two-axis benchmark
        run: pnpm -C apps/rsp bench:two-axis:check

      - name: Require committed benchmark results
        run: git diff --exit-code -- apps/rsp/bench/results/rsp-two-axis.toon apps/rsp/bench/results/rsp-two-axis.md
