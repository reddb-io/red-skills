# PR-level memory drift guard (PRD #217, slice #224, ADR 0027 Gap 3).
#
# The in-session PostToolUse hook (#222) already keeps the Claude-runner path in
# sync; this guard is the symmetric PR-level net for everything hooks cannot see
# — Codex contributors and the human-only "vim the ADR" case.
#
# Fires on every PR. If any watched memory surface changed
# (.red/adr/**, .red/CONTEXT.md, .red/CONTEXT-MAP.md, .red/contexts/**) without
# an audit marker (#218) — a `Memory-Ingested: <sha>` / `Memory-NoIngest:
# <reason>` trailer on the head commit, or a `.red/memory/.audit.log` entry —
# the guard fails the check with one actionable line and emits a
# `memory.drift.caught` event (ADR 0025). Code-only PRs pass silently.
#
# The guard never ingests into the graph from CI (ADR 0027 rejected that — the
# graph store is local). It only checks for the marker and records telemetry.

name: red-memory-drift-guard

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: red-memory-drift-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  drift-guard:
    runs-on: ubuntu-latest
    steps:
      # Check out the real PR head commit (not the synthetic merge commit) so the
      # head-commit-message trailer scan sees the contributor's own commit.
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch base ref
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build memory plugin
        working-directory: src/apps/memory
        run: |
          set -euo pipefail
          pnpm build

      - name: Run drift guard
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Changed files vs the PR merge base (three-dot diff). FETCH_HEAD is the
          # base tip fetched above, so this is robust without a remote-tracking ref.
          git diff --name-only FETCH_HEAD...HEAD > changed-files.txt
          echo "changed files:"; cat changed-files.txt

          if ! node src/apps/memory/dist/cli.js drift-guard \
              --root "$GITHUB_WORKSPACE" \
              --changed-files "$GITHUB_WORKSPACE/changed-files.txt" \
              --pr-number "$PR_NUMBER" \
              --head-sha "$HEAD_SHA" \
              --base-ref "$BASE_REF"; then
            {
              echo "### Memory drift guard failed"
              echo ""
              echo "A watched memory surface changed without an audit marker."
              echo "Run \`/memory:ingest <path>\` and re-push, or add a"
              echo "\`Memory-NoIngest: <reason>\` trailer to the head commit for trivial edits."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
