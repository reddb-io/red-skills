name: red-memory-bench

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core-regression-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # red-castle submodule must exist so the workspace pnpm install resolves.
          submodules: recursive

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install red binary for SDK
        uses: ./.github/actions/install-red-binary
        with:
          github-token: ${{ github.token }}

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Memory bench deterministic core regression gate
        run: >
          pnpm -C apps/benchmark-memory dev
          bench eval core
          --analytics memory-bench-ci.rdb
          --gate
