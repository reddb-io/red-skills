name: Redskilled Mobile APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/red-mobile-apk.yml'
      - 'apps/redskilled-mobile/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: redskilled-mobile-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      apk-name: ${{ steps.artifact.outputs.name }}
    env:
      REDDB_SKIP_POSTINSTALL: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Enable the repository package manager
        run: corepack enable
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate the Android project
        working-directory: apps/redskilled-mobile
        env:
          CI: '1'
        run: pnpm exec expo prebuild --platform android --clean --no-install
      - name: Generate disposable PR signing key
        if: github.event_name == 'pull_request'
        id: pr-signing
        run: |
          install -d -m 700 "$RUNNER_TEMP/redskilled-signing"
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/redskilled-signing/pr.jks" \
            -storetype JKS \
            -alias redskilled-pr \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname "CN=Redskilled PR" \
            -storepass redskilled-ci-only \
            -keypass redskilled-ci-only >/dev/null
          echo "keystore=$RUNNER_TEMP/redskilled-signing/pr.jks" >> "$GITHUB_OUTPUT"
      - name: Restore permanent release signing key
        if: github.event_name != 'pull_request'
        id: release-signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          install -d -m 700 "$RUNNER_TEMP/redskilled-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/redskilled-signing/release.jks"
          chmod 600 "$RUNNER_TEMP/redskilled-signing/release.jks"
          echo "keystore=$RUNNER_TEMP/redskilled-signing/release.jks" >> "$GITHUB_OUTPUT"
      - name: Build signed release APK
        working-directory: apps/redskilled-mobile/android
        env:
          REDSKILLED_ANDROID_KEYSTORE_FILE: ${{ steps.pr-signing.outputs.keystore || steps.release-signing.outputs.keystore }}
          REDSKILLED_ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name == 'pull_request' && 'redskilled-ci-only' || secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          REDSKILLED_ANDROID_KEY_ALIAS: ${{ github.event_name == 'pull_request' && 'redskilled-pr' || secrets.ANDROID_RELEASE_KEY_ALIAS }}
          REDSKILLED_ANDROID_KEY_PASSWORD: ${{ github.event_name == 'pull_request' && 'redskilled-ci-only' || secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Verify and name the APK
        id: artifact
        working-directory: apps/redskilled-mobile
        run: |
          version=$(node -p "require('./package.json').version")
          name="redskilled-android-${version}.apk"
          install -d dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk "dist-apk/$name"
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$build_tools/apksigner" verify --verbose --print-certs "dist-apk/$name"
          sha256sum "dist-apk/$name" > "dist-apk/$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: redskilled-android-apk
          path: apps/redskilled-mobile/dist-apk/*
          if-no-files-found: error
          retention-days: 3

  attach-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: redskilled-android-apk
          path: dist-apk
      - name: Wait for the matching GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          for attempt in $(seq 1 18); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "GitHub Release $TAG did not appear within three minutes" >&2
          exit 1
      - name: Attach APK to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          APK_NAME: ${{ needs.build-apk.outputs.apk-name }}
        run: |
          existing=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          if grep -Fxq "$APK_NAME" <<< "$existing" || grep -Fxq "$APK_NAME.sha256" <<< "$existing"; then
            echo "Release already contains a Redskilled APK asset; refusing to replace it" >&2
            exit 1
          fi
          gh release upload "$TAG" \
            "dist-apk/$APK_NAME#Redskilled Android APK" \
            "dist-apk/$APK_NAME.sha256#Redskilled Android APK SHA-256"
