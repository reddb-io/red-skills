name: red-workspace-ci

# Pre-merge workspace gate: typecheck + tests on every PR.
#
# typecheck: until this existed, `pnpm typecheck` ran ONLY in red-release.yml on
# push-to-main — AFTER merge — so a type break landed silently on a PR (the
# WorkerVitals S2 `usage` variant, ADR 0065). Now it runs per-PR.
#
# test: the apps/dev vitest suite (1300+ tests). It was previously kept OUT of CI
# because supervisor.test.ts ran an instant-`io.sleep` runaway loop that OOM-killed
# the vitest worker (#446); that loop is fixed, so the suite is now a reliable
# gate. Scoped to apps/dev — the AFK-critical suite that is verified green here;
# broadening to the other apps' suites is a follow-up.
#
# scope: the heavy jobs are narrowed to the change's affected cone by
# scripts/ci-affected-scope.mjs, on the same principle the AFK feedback gate
# already uses (apps/dev/src/core/validation-scope.ts). The narrowing is
# step-level ON PURPOSE: a trigger-level `paths`/`paths-ignore` filter or a
# job-level `if:` makes a required check vanish or report "skipped", which leaves
# branch protection waiting forever on a docs PR. Every job here still runs on
# every PR and still reports a conclusion; only the work inside it shrinks.
# An unclassifiable change escalates to the whole workspace (#2750).

on:
  pull_request:
  # A merge queue tests each candidate on a temporary `gh-readonly-queue/*` branch
  # and reports through the `merge_group` event. Without this trigger the required
  # checks never report for a queued entry, so the queue accepts pull requests and
  # then holds them forever — which is exactly what it did on 2026-07-31, with
  # three entries queued and no run against any queue branch.
  merge_group:
  push:
    # automation/toon-bump is written with GITHUB_TOKEN, whose events never
    # trigger pull_request workflows, so it needs this push entrance to be
    # checked at all. red-release/version-pr does NOT appear here: it pushes
    # with RELEASE_PAT and therefore receives the ordinary pull_request checks.
    # That claim was false between ADR 0139 and 2026-08-13 — the job had lost
    # the PAT, so the Version PR's checks never started and every release
    # needed a hand-pushed commit.
    branches: [main, automation/toon-bump]

permissions:
  contents: read

jobs:
  # Resolve the affected cone once; the heavy jobs read it through `needs`.
  # A push (main / automation branch) always gets the whole workspace: there is
  # no pull-request base to diff against and post-merge state must never be
  # under-validated.
  scope:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.compute.outputs.mode }}
      test_packages: ${{ steps.compute.outputs.test_packages }}
      run_typecheck: ${{ steps.compute.outputs.run_typecheck }}
      run_manifest_checks: ${{ steps.compute.outputs.run_manifest_checks }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          # Full history so the merge-base diff against the PR base resolves.
          fetch-depth: 0

      - name: Compute affected cone
        id: compute
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            node scripts/ci-affected-scope.mjs --whole-workspace --github-output
            exit 0
          fi
          # Fetching the base branch is what makes the three-dot merge-base diff
          # possible; if it fails, the scoper sees an empty diff and falls back
          # to the whole workspace rather than narrowing on an unknown set.
          git fetch --no-tags --depth=0 origin "$BASE_REF" || true
          base="$BASE_SHA"
          if [ -z "$base" ]; then base="origin/$BASE_REF"; fi
          node scripts/ci-affected-scope.mjs --base "$base" --head HEAD --github-output

      # This belongs beside the PR diff owner, not in a working-tree invariant:
      # explicit event SHAs make the answer independent of a contributor's
      # checked-out branch. Docs, .red, and workflow-only exemptions are stated
      # by the checker; an apps/ or packages/ diff must name its release intent.
      - name: Require a release entry for shippable changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/require-release-entry.mjs --base "$BASE_SHA" --head "$HEAD_SHA"

  workflow-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Test workflow security pins
        run: scripts/test-workflow-security-pins.sh

      - name: Test workflow fork posture
        run: scripts/test-workflow-fork-posture.sh

      - name: Test canary channel promotion contract
        run: scripts/test-afk-promote-channel.sh

      # These two ran only inside red-publish.yml, which is to say only at
      # publish time — after the last chance to fix anything. That is how a
      # refactor deleted five scripts the publish workflow calls and no check
      # went red: the only thing that reads the publish workflow was the publish
      # workflow. Reading it on every PR is the point.
      - name: Test red-release npm publish contract
        run: scripts/test-red-release-npm-publish-contract.sh

      - name: Test red-release reddb asset contract
        run: scripts/test-red-release-reddb-assets-contract.sh

      # ADR 0139: a changeset that cannot resolve does not get skipped — it
      # throws and abandons the whole release plan, so one bad file fails every
      # release after it (#2863). This job is the only one a changeset-only PR
      # reaches: `.changeset/` is INERT to scripts/ci-affected-scope.mjs, so the
      # test and typecheck jobs narrow themselves away on exactly that PR.
      - name: Validate pending changesets resolve against the workspace
        run: node scripts/validate-changesets.mjs

      - name: Test changeset validation contract
        run: scripts/test-validate-changesets.sh

      - name: Test red-castle vendor contract
        run: scripts/test-red-castle-vendor-contract.sh

      - name: Test hitl-card merge token contract
        run: scripts/test-red-hitl-card-merge-token-contract.sh

      - name: Test marketplace manifest validator
        run: scripts/test-validate-marketplace-manifests.sh

      # #3059: the installer's marketplace source decides whether a machine can
      # ever update. A directory registration re-reads the install-day snapshot
      # forever, so this pins the GitHub source and the frozen-machine heal.
      - name: Test installer marketplace source contract
        run: scripts/test-install-marketplace-source.sh

      - name: Test CI affected-scope contract
        run: scripts/test-ci-affected-scope.sh

      # Cheap and mechanical: asserts the canary still fires on a schedule and
      # still is NOT a merge gate. The walk itself runs in red-mcp-lane-canary.
      - name: Test MCP lane canary schedule contract
        run: scripts/test-mcp-lane-canary-schedule.sh



  typecheck:
    runs-on: ubuntu-latest
    needs: scope
    env:
      # Both step families need install; compute the union once.
      RUN_ANY: ${{ needs.scope.outputs.run_typecheck == 'true' || needs.scope.outputs.run_manifest_checks == 'true' }}
    steps:
      - name: Checkout
        if: env.RUN_ANY == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - if: env.RUN_ANY == 'true'
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - if: env.RUN_ANY == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install workspace dependencies
        if: env.RUN_ANY == 'true'
        env:
          # This PR gate typechecks/tests apps/dev; it does not execute the
          # @reddb-io/sdk-backed memory/brain runtimes. Skip the SDK postinstall
          # binary download so CI is not coupled to reddb release assets.
          REDDB_SKIP_POSTINSTALL: "1"
        run: pnpm install --frozen-lockfile

      - name: Check generated Codex manifests
        if: needs.scope.outputs.run_manifest_checks == 'true'
        run: pnpm codex:manifests:check

      - name: Check generated Gemini manifests
        if: needs.scope.outputs.run_manifest_checks == 'true'
        run: pnpm gemini:manifests:check

      - name: Check generated Pi manifests
        if: needs.scope.outputs.run_manifest_checks == 'true'
        run: pnpm pi:manifests:check

      - name: Check generated Pi npm packages
        if: needs.scope.outputs.run_manifest_checks == 'true'
        run: pnpm pi:packages:check

      # These need the installed workspace: they spawn the bundler and the
      # manifest generators. They rode in `workflow-security`, which carries a
      # checkout and nothing else, so every `pnpm` was `command not found` and
      # the contract read that as manifest drift.
      - name: Test bundle-app contract
        if: env.RUN_ANY == 'true'
        run: scripts/test-bundle-app-contract.sh

      - name: Test generate-manifests contract
        if: env.RUN_ANY == 'true'
        run: scripts/test-generate-manifests-contract.sh

      - name: Lint workspace (oxlint, import + correctness)
        if: needs.scope.outputs.run_typecheck == 'true'
        run: pnpm lint

      - name: Typecheck workspace (apps + packages, excludes red-castle)
        if: needs.scope.outputs.run_typecheck == 'true'
        run: pnpm typecheck

      - name: Report narrowed scope
        if: env.RUN_ANY != 'true'
        run: echo "No typed or manifest input changed (scope ${{ needs.scope.outputs.mode }}) — nothing to check."

  # The apps/dev suite is the merge-latency critical path: 423 files / 6000+
  # tests, and `fileParallelism: false` in its vitest config runs them one file
  # at a time, so a single runner spends ~4m45s of a ~5m job on this one step.
  # `--shard=N/4` splits the FILE set four ways across four runners that each
  # keep the serial-within-runner semantics the config asks for; per-runner
  # fixed cost is seconds (checkout 4s, install 6s), so the fan-out is nearly
  # pure win. The narrowing is unchanged — the whole matrix idles on a PR whose
  # cone does not contain apps/dev.
  test-shard:
    runs-on: ubuntu-latest
    needs: scope
    strategy:
      # A failing shard must not cancel its siblings: the run has to report
      # every failure at once, not just the first shard to notice one.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      RUN_DEV: ${{ contains(fromJSON(needs.scope.outputs.test_packages), 'apps/dev') }}
    steps:
      - name: Checkout
        if: env.RUN_DEV == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - if: env.RUN_DEV == 'true'
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - if: env.RUN_DEV == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      # The apps/dev suite includes tq-contract tests (toon-docs.test.ts spawns
      # the real binary against produced TOONL lane files), so the required host
      # binary must exist here exactly as it does on dev machines (/red-setup)
      # and in red-rsp-benchmark-ci.yml. Same pinned installer, no fallback.
      #
      # From the GitHub release, not crates.io. tq's crates publish runs on a
      # token that can lapse independently of the release itself — it did, at
      # 0.21.0, with a 403 nobody saw — and when it lapses `cargo install`
      # takes every branch of this repository down with it. The release asset
      # is published by the same tag that would have fed crates.io, carries a
      # checksum, and skips a full cargo build besides.
      - name: Install pinned tq
        if: env.RUN_DEV == 'true'
        env:
          TQ_VERSION: v0.26.2
        run: |
          set -euo pipefail
          tq_root="$RUNNER_TEMP/tq"
          mkdir -p "$tq_root/bin"
          base="https://github.com/reddb-io/tq/releases/download/${TQ_VERSION}"
          scripts/ci-fetch-with-retry.sh "$base/tq-linux-x86_64-static" "$tq_root/bin/tq"
          scripts/ci-fetch-with-retry.sh "$base/tq-linux-x86_64-static.sha256" "$tq_root/tq.sha256"
          echo "$(cut -d' ' -f1 "$tq_root/tq.sha256")  $tq_root/bin/tq" | sha256sum -c -
          chmod +x "$tq_root/bin/tq"
          echo "$tq_root/bin" >> "$GITHUB_PATH"
          "$tq_root/bin/tq" --version

      - name: Install workspace dependencies
        if: env.RUN_DEV == 'true'
        env:
          # This PR gate typechecks/tests apps/dev; it does not execute the
          # @reddb-io/sdk-backed memory/brain runtimes. Skip the SDK postinstall
          # binary download so CI is not coupled to reddb release assets.
          REDDB_SKIP_POSTINSTALL: "1"
        run: pnpm install --frozen-lockfile

      - name: Test apps/dev (includes packages/shared)
        if: env.RUN_DEV == 'true'
        # No `--` before the flag: pnpm forwards the separator VERBATIM, and
        # vitest then reads `--shard=…` as a filename filter and runs the whole
        # suite on every shard — four full runs that all pass, which is exactly
        # what a broken shard split looks like from the outside.
        run: pnpm -C apps/dev test --shard=${{ matrix.shard }}/4

      - name: Report narrowed scope
        if: env.RUN_DEV != 'true'
        run: echo "apps/dev is not in the affected cone (scope ${{ needs.scope.outputs.mode }}) — no shard to run."

  # The remaining suites are seconds-cheap, so they stay in one job rather than
  # paying a runner's fixed cost each.
  test-packages:
    runs-on: ubuntu-latest
    needs: scope
    env:
      # JSON array of every package in the affected cone; each step below asks
      # whether its own package is in it.
      PACKAGES: ${{ needs.scope.outputs.test_packages }}
      # apps/dev is deliberately absent: it belongs to the shard matrix, and
      # asking for it here would install a workspace for no step to use.
      RUN_ANY: >-
        ${{ contains(fromJSON(needs.scope.outputs.test_packages), 'apps/opencode-host')
        || contains(fromJSON(needs.scope.outputs.test_packages), 'apps/afk-container')
        || contains(fromJSON(needs.scope.outputs.test_packages), 'apps/herdr-plugin-red-skills')
        || contains(fromJSON(needs.scope.outputs.test_packages), 'apps/vscode-extension-red-skills') }}
    steps:
      - name: Checkout
        if: env.RUN_ANY == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - if: env.RUN_ANY == 'true'
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - if: env.RUN_ANY == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install workspace dependencies
        if: env.RUN_ANY == 'true'
        env:
          # This PR gate typechecks/tests apps/dev; it does not execute the
          # @reddb-io/sdk-backed memory/brain runtimes. Skip the SDK postinstall
          # binary download so CI is not coupled to reddb release assets.
          REDDB_SKIP_POSTINSTALL: "1"
        run: pnpm install --frozen-lockfile

      - name: Test apps/opencode-host
        if: contains(fromJSON(env.PACKAGES), 'apps/opencode-host')
        run: pnpm -C apps/opencode-host test

      - name: Test apps/afk-container
        if: contains(fromJSON(env.PACKAGES), 'apps/afk-container')
        run: pnpm -C apps/afk-container test

      - name: Test apps/herdr-plugin-red-skills
        if: contains(fromJSON(env.PACKAGES), 'apps/herdr-plugin-red-skills')
        run: pnpm -C apps/herdr-plugin-red-skills test

      # The extension's suite binds a real unix socket per test file (the fake
      # daemon), so it needs a runner and not only a typecheck.
      - name: Test apps/vscode-extension-red-skills
        if: contains(fromJSON(env.PACKAGES), 'apps/vscode-extension-red-skills')
        run: pnpm -C apps/vscode-extension-red-skills test

      - name: Report narrowed scope
        if: env.RUN_ANY != 'true'
        run: echo "No non-dev package is in the affected cone (scope ${{ needs.scope.outputs.mode }}) — no suite to run."

  # Branch protection requires a check named `test`, so the name survives the
  # fan-out as an aggregate: the work moved, the contract did not.
  test:
    # `always()` is what keeps this a gate. Without it a FAILED dependency
    # skips this job, and a skipped required check is one branch protection
    # reads as satisfied — the gate would go quiet exactly when it should be
    # loud. Narrowing never produces a skip here: the dependencies always run
    # and shrink their own steps, so a docs-only PR reaches this job green.
    if: always()
    runs-on: ubuntu-latest
    needs: [scope, test-shard, test-packages]
    steps:
      - name: Fail when a test dependency failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "scope=${{ needs.scope.result }}"
          echo "test-shard=${{ needs['test-shard'].result }}"
          echo "test-packages=${{ needs['test-packages'].result }}"
          exit 1

      - name: Report aggregate result
        run: echo "All test dependencies reported success (scope ${{ needs.scope.outputs.mode }})."
