# Generated by red-skills-release. Re-run /red-setup to refresh this file.
name: RedSkills Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  publish-release:
    if: github.event.head_commit.author.name != 'red-skills-release[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          # A tag pushed with github.token cannot start downstream workflows.
          token: ${{ secrets.RELEASE_PAT }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Enable the repository package manager
        run: corepack enable
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx -y -p @reddb-io/red-skills@3.9.0 red-skills-release run
