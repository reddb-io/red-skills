# Generated by red-skills-release. Re-run /red-setup to refresh this file.
name: RedSkills Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [closed]

permissions: {}

jobs:
  maintain-version-pr:
    if: github.event_name == 'push' && github.event.head_commit.author.name != 'red-skills-release[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Maintain Version PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/red-skills/release.bundle.mjs run

  publish-release:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'red-release/version-pr'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/red-skills/release.bundle.mjs run
