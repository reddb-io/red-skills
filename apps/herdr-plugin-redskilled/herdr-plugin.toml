[[actions]]
id = "toggle-events"
title = "RedSkills: toggle host event lane"
contexts = ["global", "workspace", "tab", "pane"]
platforms = ["linux", "macos"]
command = ['sh', '-c', 'exec node "$HERDR_PLUGIN_ROOT/bin/red-skills-herdr.mjs" pane toggle events']

[[actions]]
id = "toggle-events-windows"
title = "RedSkills: toggle host event lane"
contexts = ["global", "workspace", "tab", "pane"]
platforms = ["windows"]
command = ['powershell', '-NoProfile', '-NonInteractive', '-Command', '& node "$env:HERDR_PLUGIN_ROOT\bin\red-skills-herdr.mjs" pane toggle events']

# One read, raised where an operator will see it without changing panes. The
# line is the daemon's own `statusline-string`, never this plugin's rendering of
# the payload: ADR 0130 rule 10 keeps the string a pure function of the payload
# precisely so no surface reimplements it.
[[actions]]
id = "status"
title = "RedSkills: notify host status"
contexts = ["global", "workspace", "tab", "pane"]
platforms = ["linux", "macos"]
command = ['sh', '-c', 'exec node "$HERDR_PLUGIN_ROOT/bin/red-skills-herdr.mjs" status --notify']

[[actions]]
id = "status-windows"
title = "RedSkills: notify host status"
contexts = ["global", "workspace", "tab", "pane"]
platforms = ["windows"]
command = ['powershell', '-NoProfile', '-NonInteractive', '-Command', '& node "$env:HERDR_PLUGIN_ROOT\bin\red-skills-herdr.mjs" status --notify']

# Asked when a pane says "no host answered" and the operator does not believe
# it. Its output lands in `herdr plugin log list --plugin reddb-io.red-skills`.
[[actions]]
id = "doctor"
title = "RedSkills: doctor"
contexts = ["global", "workspace", "tab", "pane"]
platforms = ["linux", "macos"]
command = ['sh', '-c', 'exec node "$HERDR_PLUGIN_ROOT/bin/red-skills-herdr.mjs" doctor']

[[actions]]
id = "doctor-windows"
title = "RedSkills: doctor"
contexts = ["global", "workspace", "tab", "pane"]
platforms = ["windows"]
command = ['powershell', '-NoProfile', '-NonInteractive', '-Command', '& node "$env:HERDR_PLUGIN_ROOT\bin\red-skills-herdr.mjs" doctor']
