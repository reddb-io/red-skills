#
# herdr-plugin.toml — registers red-skills with herdr.
#
#   herdr plugin install reddb-io/red-skills/apps/herdr-plugin-redskilled
#   herdr plugin link apps/herdr-plugin-redskilled   # from a checkout, for development
#
# The plugin is a read client of `redskilled`, the host-scoped execution daemon
# of reddb-io/red-skills (ADR 0130): exactly one singleton per machine, behind a
# unix socket, owning Worker processes across every project on that machine. It
# sends `ping`, `host-state`, `statusline-payload`, `statusline-string` and
# `statusline-dashboard`, and it sends nothing that changes the machine — ADR
# 0130 rule 9 makes reach asymmetric (read the host, write the project), and a
# monitor belongs entirely on the reading half.
#
# From a checkout every command is plain Node ESM run straight from the tree. An
# INSTALL gets this directory and nothing above it, so its two workspace links
# resolve to nothing — which is why the build hook materializes the released
# single-file bundle over the entry (issue #3060, scripts/materialize-entrypoint.mjs).

id = "reddb-io.red-skills"
name = "RedSkills"
version = "4.2.1"
# `herdr plugin pane open --env KEY=VALUE` and `--placement` are the two flags
# the panes here depend on, and 0.7.5 is the oldest herdr this plugin has been
# run against. Declaring an older floor would be a claim nobody verified.
min_herdr_version = "0.7.5"
platforms = ["linux", "macos", "windows"]
description = "Watch the redskilled host daemon from herdr: live Workers and their vitals, worker logs, the host event lane, open pull requests per project, and notifications when any of it changes."

# A preflight and a materialization, in that order and for the same reason: both
# are things worth failing the INSTALL over rather than discovering later as a
# pane that opens and immediately closes.
#
#   1. Node has to be on PATH; every command here is a Node program.
#   2. The entry has to be runnable from this directory. In a checkout it already
#      is and step 2 does nothing. In an install it is not — the workspace links
#      it imports are not downloaded with it — so the hook fetches the release's
#      single-file bundle and writes it over `bin/red-skills-herdr.mjs`, the path
#      every pane, action and startup entry below already names.
# `$HERDR_PLUGIN_ROOT` is not injected during some herdr versions' BUILD phase
# (#3303: it resolved empty and node loaded "/scripts/…" off the filesystem
# root), so the build commands fall back to the build's working directory —
# which herdr guarantees is the plugin root. Runtime commands (services, panes,
# actions) keep the plain variable: the injection gap is build-phase only.
[[build]]
platforms = ["linux", "macos"]
command = ['sh', '-c', 'node --version >/dev/null 2>&1 || { echo "red-skills needs Node.js 20+ on PATH"; exit 1; }; exec node "${HERDR_PLUGIN_ROOT:-.}/scripts/materialize-entrypoint.mjs"']

[[build]]
platforms = ["windows"]
command = ['powershell', '-NoProfile', '-NonInteractive', '-Command', 'if (-not (Get-Command node -ErrorAction SilentlyContinue)) { Write-Error "red-skills needs Node.js 20+ on PATH"; exit 1 }; $root = if ($env:HERDR_PLUGIN_ROOT) { $env:HERDR_PLUGIN_ROOT } else { "." }; & node "$root\scripts\materialize-entrypoint.mjs"; exit $LASTEXITCODE']

# The notification watcher. herdr fires this once per enabled plugin after the
# session is restored and its API socket is ready.
#
# The docs are explicit that "startup hooks are one-shot initialization
# commands, not supervised daemons", so this hook obeys that literally: it
# re-execs the loop as a detached child and RETURNS. Two consequences are
# handled on our side rather than left to herdr, which supervises neither:
#   - the child holds a single-instance lock, so a herdr restart or a second
#     session never becomes two watchers saying the same thing twice;
#   - the child exits when $HERDR_SOCKET_PATH disappears, because a notifier
#     that outlived herdr would poll forever to raise notifications nobody
#     can see.
[[startup]]
platforms = ["linux", "macos"]
command = ['sh', '-c', 'exec node "$HERDR_PLUGIN_ROOT/bin/red-skills-herdr.mjs" watch --detach']

[[startup]]
platforms = ["windows"]
command = ['powershell', '-NoProfile', '-NonInteractive', '-Command', '& node "$env:HERDR_PLUGIN_ROOT\bin\red-skills-herdr.mjs" watch --detach']

# ── panes ────────────────────────────────────────────────────────────────────
# Every pane command runs the entry by absolute path under $HERDR_PLUGIN_ROOT: a
# pane's cwd is the directory it was opened from, not the plugin root, and the
# entry is not on PATH.

[[panes]]
id = "dashboard"
title = "RedSkills"
placement = "split"
platforms = ["linux", "macos"]
command = ['sh', '-c', 'exec node "$HERDR_PLUGIN_ROOT/bin/red-skills-herdr.mjs" dashboard']

[[panes]]
id = "dashboard-windows"
title = "RedSkills"
placement = "split"
platforms = ["windows"]
# Deliberately without -NonInteractive: this hosts a keyboard-driven TUI, and
# -NonInteractive breaks its input.
command = ['powershell', '-NoProfile', '-Command', '& node "$env:HERDR_PLUGIN_ROOT\bin\red-skills-herdr.mjs" dashboard']

# The statusline with a pane's height: the daemon's own header line and one row
# per Worker, printed exactly as it renders them. Nothing here recomputes a cell.
[[panes]]
id = "board"
title = "RedSkills board"
placement = "split"
platforms = ["linux", "macos"]
command = ['sh', '-c', 'exec node "$HERDR_PLUGIN_ROOT/bin/red-skills-herdr.mjs" board']

[[panes]]
id = "board-windows"
title = "RedSkills board"
placement = "split"
platforms = ["windows"]
# Deliberately without -NonInteractive: this hosts a keyboard-driven TUI.
command = ['powershell', '-NoProfile', '-Command', '& node "$env:HERDR_PLUGIN_ROOT\bin\red-skills-herdr.mjs" board']

[[panes]]
id = "logs"
title = "Worker log"
placement = "split"
platforms = ["linux", "macos"]
command = ['sh', '-c', 'exec node "$HERDR_PLUGIN_ROOT/bin/red-skills-herdr.mjs" logs']

[[panes]]
id = "logs-windows"
title = "Worker log"
placement = "split"
platforms = ["windows"]
command = ['powershell', '-NoProfile', '-Command', '& node "$env:HERDR_PLUGIN_ROOT\bin\red-skills-herdr.mjs" logs']

[[panes]]
id = "events"
title = "Host events"
placement = "split"
platforms = ["linux", "macos"]
command = ['sh', '-c', 'exec node "$HERDR_PLUGIN_ROOT/bin/red-skills-herdr.mjs" logs --events']

[[panes]]
id = "events-windows"
title = "Host events"
placement = "split"
platforms = ["windows"]
command = ['powershell', '-NoProfile', '-Command', '& node "$env:HERDR_PLUGIN_ROOT\bin\red-skills-herdr.mjs" logs --events']

# ── actions ──────────────────────────────────────────────────────────────────

[[actions]]
id = "toggle-dashboard"
title = "RedSkills: toggle dashboard"
contexts = ["global", "workspace", "tab", "pane"]
platforms = ["linux", "macos"]
command = ['sh', '-c', 'exec node "$HERDR_PLUGIN_ROOT/bin/red-skills-herdr.mjs" pane toggle dashboard']

[[actions]]
id = "toggle-dashboard-windows"
title = "RedSkills: toggle dashboard"
contexts = ["global", "workspace", "tab", "pane"]
platforms = ["windows"]
command = ['powershell', '-NoProfile', '-NonInteractive', '-Command', '& node "$env:HERDR_PLUGIN_ROOT\bin\red-skills-herdr.mjs" pane toggle dashboard']

[[actions]]
id = "open-dashboard-tab"
title = "RedSkills: dashboard in a tab"
contexts = ["global", "workspace", "tab", "pane"]
platforms = ["linux", "macos"]
command = ['sh', '-c', 'exec node "$HERDR_PLUGIN_ROOT/bin/red-skills-herdr.mjs" pane open dashboard --placement tab']

[[actions]]
id = "open-dashboard-tab-windows"
title = "RedSkills: dashboard in a tab"
contexts = ["global", "workspace", "tab", "pane"]
platforms = ["windows"]
command = ['powershell', '-NoProfile', '-NonInteractive', '-Command', '& node "$env:HERDR_PLUGIN_ROOT\bin\red-skills-herdr.mjs" pane open dashboard --placement tab']

[[actions]]
id = "toggle-board"
title = "RedSkills: toggle statusline board"
contexts = ["global", "workspace", "tab", "pane"]
platforms = ["linux", "macos"]
command = ['sh', '-c', 'exec node "$HERDR_PLUGIN_ROOT/bin/red-skills-herdr.mjs" pane toggle board']

[[actions]]
id = "toggle-board-windows"
title = "RedSkills: toggle statusline board"
contexts = ["global", "workspace", "tab", "pane"]
platforms = ["windows"]
command = ['powershell', '-NoProfile', '-NonInteractive', '-Command', '& node "$env:HERDR_PLUGIN_ROOT\bin\red-skills-herdr.mjs" pane toggle board']

[[actions]]
id = "toggle-logs"
title = "RedSkills: toggle worker log"
contexts = ["global", "workspace", "tab", "pane"]
platforms = ["linux", "macos"]
command = ['sh', '-c', 'exec node "$HERDR_PLUGIN_ROOT/bin/red-skills-herdr.mjs" pane toggle logs']

[[actions]]
id = "toggle-logs-windows"
title = "RedSkills: toggle worker log"
contexts = ["global", "workspace", "tab", "pane"]
platforms = ["windows"]
