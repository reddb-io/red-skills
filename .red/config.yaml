# Active dev-plugin settings, all namespaced under `plugins.dev.*` (the root
# stays sacred). The AFK opencode model is NOT pinned here — the GHA lane sets it
# (rs-afk-attempt.yml passes `model: minimax/MiniMax-M3` via RED_AFK_MODEL), so
# the workflow is the single source of truth for the cloud runner's model.
plugins:
  dev:
    enabled: true                # opt this directory into the dev plugin (ADR 0067)
    lock:
      primary-branch: true       # primary-checkout branch-switch guard
    afk:
      # Maintainer decision 2026-08-03: codex is this repo's executor.
      #
      # The `models.codex.*` table below only says WHICH MODEL codex uses once
      # codex runs — it never SELECTS the runner. That is why a fully-populated
      # codex model table still drained the whole backlog on claude: the table
      # was right and nothing was reading it, because nothing chose codex.
      #
      # Two things still beat this key, and both beat it silently:
      #   - `RED_AFK_RUNNER` in the environment, and an explicit `--runner`;
      #   - a `project_start` that NAMES a runner, which pins the registration
      #     for its whole life. A dispatcher passing `runner: claude` wins over
      #     this file every time, so changing this line alone does not move a
      #     registration that is already standing.
      default_runner: codex
      models:
        # Maintainer decision 2026-07-28: the claude runner is pinned to Opus 5
        # on EVERY tier — validate included — so the local fleet never falls back
        # to the 4.x defaults (`claude-haiku-4-5` / `claude-sonnet-4-6` /
        # `claude-opus-4-8`). `base` is the per-runner one-liner (ADR 0049): it
        # auto-populates all four tiers, and each tier keeps its own default
        # effort (validate low, simple high, complex medium, think high). Pin a
        # single tier back by giving it its own `<tier>.model`.
        claude:
          base:
            model: claude-opus-5
        # GPT-5.6 (released 2026-07-09) for coding tiers; `validate` — the
        # fuzzy-validation / contract-review tier — deliberately stays on 5.5.
        # `gpt-5.6-sol` is the flagship of the sol/terra/luna family and is
        # verified working on this host (codex-cli 0.144.6), despite the still-open
        # Linux report at openai/codex#31869 against 0.144.0.
        codex:
          validate:
            model: gpt-5.5       # review lane — held on 5.5 by maintainer choice
            effort: high         # raised from the `low` default
          simple:
            model: gpt-5.6-sol   # coding
            effort: high
          complex:
            model: gpt-5.6-sol   # coding
            effort: high         # raised from the `medium` default
          think:
            model: gpt-5.6-sol   # design/routing — grouped with coding
            effort: high
    # Adversarial review (ADR 0110, Spec #2205 — all slices landed 2026-07-19).
    # Folds to `review.*`. Review is the gate fold's third stage (ADR 0129): a
    # blocking finding draws the RESERVED review round of the Re-seed budget, and
    # exhaustion parks `ready-for-human` + `blocked:validation` uniformly — the
    # old `cap < 2` cliff that landed known blocking findings is gone.
    # `max_iterations` now bounds only the reviewer agent's own loop.
    review:
      # Maintainer decision 2026-07-22: review OFF in this repo — the extra
      # bounded round was still costing wall-clock on every landing during the
      # reliability push. Re-enable by flipping this back to true.
      enabled: false
      max_iterations: 1
      reviewer_count: 1
      quorum: any
      # The model is honoured only on a runner whose CLI can dispatch it (#2352):
      # under the claude fleet this codex slug is substituted for claude's own
      # review-tier default with a logged notice, never spawned. Pin
      # `runner: codex` here to make the reviewer actually run this model.
      model: gpt-5.6-sol       # adversarial reviewer runs on the newer model...
      effort: medium           # ...at medium effort — the review pass is bounded
                               # to one iteration, so depth matters less than the
                               # implementer tiers that run at high.
  internal:
    enabled: true                # maintainer-only repo operations plugin (ADR 0067)

# rsp token-efficiency surface (per-repo opt-in; hook stays inert without enabled: true)
rsp:
  enabled: false               # maintainer decision 2026-07-28: off in this repo
  ttlDays: 7
  byteBudget: 67108864
  heavyGitByteThreshold: 8192
