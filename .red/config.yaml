# Active dev-plugin settings, all namespaced under `plugins.dev.*` (the root
# stays sacred). The AFK opencode model is NOT pinned here — the GHA lane sets it
# (rs-afk-attempt.yml passes `model: minimax/MiniMax-M3` via RED_AFK_MODEL), so
# the workflow is the single source of truth for the cloud runner's model.
plugins:
  dev:
    enabled: true                # opt this directory into the dev plugin (ADR 0067)
    lock:
      primary-branch: true       # primary-checkout branch-switch guard
    afk:
      setup:
        - pnpm install --frozen-lockfile
      # Local AFK validation reproves workspace types and repo invariants inside
      # the per-Ticket budget. The merge queue's required `test` check owns the
      # full-suite verdict on the live tip.
      # Declared as the ADR 0135 Validation-moment schedule; the legacy
      # feedback.commands/backpressure knobs are RETIRED at 3.6.0.
      validation:
        preflight: true
        generated:
          paths:
            - plugins/*/package.json
            - plugins/*/.claude-plugin/plugin.json
            - plugins/*/.codex-plugin/plugin.json
            - plugins/*/.gemini-plugin/plugin.json
            # The SOURCE the mirror is generated FROM, not just the mirror. A
            # branch that adds or edits a skill touched none of the paths above,
            # so the regeneration moment never fired and the staleness surfaced
            # in CI instead — four times over (#3403, #3419, #3436, #3445).
            - plugins/*/skills/**
            - packaging/pi/**
          command: pnpm generate-manifests && pnpm pi:packages:build
        post_done:
          - pnpm typecheck
          - pnpm -C apps/dev test:invariants
      # Maintainer decision 2026-08-03: codex is this repo's executor.
      #
      # The `models.codex.*` table below only says WHICH MODEL codex uses once
      # codex runs — it never SELECTS the runner. That is why a fully-populated
      # codex model table still drained the whole backlog on claude: the table
      # was right and nothing was reading it, because nothing chose codex.
      #
      # Two things still beat this key, and both beat it silently:
      #   - `RED_AFK_RUNNER` in the environment, and an explicit `--runner`;
      #   - a `project_start` that NAMES a runner, which pins the registration
      #     for its whole life. A dispatcher passing `runner: claude` wins over
      #     this file every time, so changing this line alone does not move a
      #     registration that is already standing.
      default_runner: codex
      # Maintainer decision 2026-08-13: this repo keeps a STANDING registration.
      #
      # A registration is a producer's lease, so without this block the repo is
      # registered only while some producer happens to be alive and reads
      # `rsk=unregistered` the moment one dies. The MCP resident's registration
      # delivery re-registers whenever nothing standing is held, so declaring it
      # here is what makes the reconnect survive a daemon restart, a plugin
      # reload and a reboot.
      #
      # This is opt-in by design and there is no product default: a standing
      # drain means the host births Workers here on its own. `target` is how
      # many it may hold at once, under the host's own worker ceiling — lower it
      # to share the machine, remove the block to stop drainage entirely.
      standing:
        runner: codex
        target: 2
      models:
        # Maintainer decision 2026-08-05: exactly TWO runner/model combinations
        # exist in this repo — claude is `claude-opus-5` at high and codex is
        # `gpt-5.6-sol` at high, on EVERY tier including validate. `base` is the
        # per-runner one-liner (ADR 0049): it auto-populates all four tiers with
        # this model+effort pair, and no tier carries its own override because an
        # explicit tier key would silently beat the base pair. This supersedes
        # the 2026-07-28 claude pin (which left tier efforts on their defaults)
        # and the validate-stays-on-5.5 codex choice.
        claude:
          base:
            model: claude-opus-5
            effort: high
        codex:
          base:
            model: gpt-5.6-sol
            effort: high
      labels:
        hitl_types:
          - wayfinder:grilling
          - wayfinder:prototype
    # Adversarial review (ADR 0110, Spec #2205 — all slices landed 2026-07-19).
    # Folds to `review.*`. Review is the gate fold's third stage (ADR 0129): a
    # blocking finding draws the RESERVED review round of the Re-seed budget, and
    # exhaustion parks `ready-for-human` + `blocked:validation` uniformly — the
    # old `cap < 2` cliff that landed known blocking findings is gone.
    # `max_iterations` now bounds only the reviewer agent's own loop.
    review:
      # Maintainer decision 2026-07-22: review OFF in this repo — the extra
      # bounded round was still costing wall-clock on every landing during the
      # reliability push. Re-enable by flipping this back to true.
      enabled: false
      max_iterations: 1
      reviewer_count: 1
      quorum: any
      # The model is honoured only on a runner whose CLI can dispatch it (#2352):
      # under the claude fleet this codex slug is substituted for claude's own
      # review-tier default with a logged notice, never spawned. Pin
      # `runner: codex` here to make the reviewer actually run this model.
      model: gpt-5.6-sol       # adversarial reviewer rides the codex combo —
      effort: high             # the repo runs exactly two runner/model pairs
                               # (2026-08-05), so review carries the same
                               # gpt-5.6-sol/high pair as every codex tier.
  internal:
    enabled: true                # maintainer-only repo operations plugin (ADR 0067)

# rsp token-efficiency surface (per-repo opt-in; hook stays inert without enabled: true)
rsp:
  enabled: false               # maintainer decision 2026-07-28: off in this repo
  ttlDays: 7
  byteBudget: 67108864
  heavyGitByteThreshold: 8192

# ADR 0139 dogfood: the Release standard is the sole product-version writer.
release:
  scheme: semver
  trigger: version-pr
  prerelease: false
  execution: vendored
  version_surfaces:
    - { path: package.json, format: npm }
    - { path: apps/afk-container/package.json, format: npm }
    - { path: apps/benchmark-code-understanding/package.json, format: npm }
    - { path: apps/benchmark-memory/package.json, format: npm }
    - { path: apps/brain/package.json, format: npm }
    - { path: apps/code-nav/package.json, format: npm }
    - { path: apps/dev/package.json, format: npm }
    - { path: apps/herdr-plugin-red-skills/package.json, format: npm }
    - { path: apps/memory/package.json, format: npm }
    - { path: apps/opencode-host/package.json, format: npm }
    - { path: apps/red-browser/package.json, format: npm }
    - { path: apps/redskilled/package.json, format: npm }
    - { path: apps/release/package.json, format: npm }
    - { path: apps/rsp/package.json, format: npm }
    - { path: apps/vscode-extension-red-skills/package.json, format: npm }
    - { path: packages/brand-tokens/package.json, format: npm }
    - { path: packages/browser-bridge/package.json, format: npm }
    - { path: packages/build-info/package.json, format: npm }
    - { path: packages/cdp-driver/package.json, format: npm }
    - { path: packages/github/package.json, format: npm }
    - { path: packages/protocol-acp/package.json, format: npm }
    - { path: packages/red-castle/package.json, format: npm }
    - { path: packages/redskilled-render/package.json, format: npm }
    - { path: packages/shared/package.json, format: npm }
    - { path: plugins/brain/package.json, format: npm }
    - { path: plugins/dev/package.json, format: npm }
    - { path: plugins/internal/package.json, format: npm }
    - { path: plugins/memory/package.json, format: npm }
    - { path: plugins/brain/.claude-plugin/plugin.json, format: npm }
    - { path: plugins/brain/.codex-plugin/plugin.json, format: npm }
    - { path: plugins/brain/.gemini-plugin/plugin.json, format: npm }
    - { path: plugins/dev/.claude-plugin/plugin.json, format: npm }
    - { path: plugins/dev/.codex-plugin/plugin.json, format: npm }
    - { path: plugins/dev/.gemini-plugin/plugin.json, format: npm }
    - { path: plugins/internal/.claude-plugin/plugin.json, format: npm }
    - { path: plugins/internal/.codex-plugin/plugin.json, format: npm }
    - { path: plugins/internal/.gemini-plugin/plugin.json, format: npm }
    - { path: plugins/memory/.claude-plugin/plugin.json, format: npm }
    - { path: plugins/memory/.codex-plugin/plugin.json, format: npm }
    - { path: plugins/memory/.gemini-plugin/plugin.json, format: npm }
    - { path: packaging/pi/brain/package.json, format: npm }
    - { path: packaging/pi/dev/package.json, format: npm }
    - { path: packaging/pi/internal/package.json, format: npm }
    - { path: packaging/pi/memory/package.json, format: npm }
  sync_command: node scripts/sync-release-exotics.mjs && pnpm generate-manifests && pnpm pi:packages:build
