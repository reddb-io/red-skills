# pnpm v11+ moved the "pnpm" field from plugins/memory/package.json here.
# Approving build scripts lets AFK feedback gates run `pnpm install` without
# hitting ERR_PNPM_IGNORED_BUILDS (the inner agent has no TTY to interact).
onlyBuiltDependencies:
  - "@reddb-io/sdk"
  - esbuild

allowBuilds:
  "@reddb-io/sdk": true
  esbuild: true
