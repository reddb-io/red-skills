interface:
  display_name: "Go"
  short_description: "Middle tier of the dispatch spectrum - /goal → /go → /afk. Use for genuinely untracked, ad-hoc, one-off demands only; anything that is or should be a tracked issue belongs to /afk. Mints a disposable issue, spins a dedicated worker, and brings back a PR. Add --scout \"<question>\" for a read-only investigation that posts a report comment and mutates nothing."
policy:
  allow_implicit_invocation: false
