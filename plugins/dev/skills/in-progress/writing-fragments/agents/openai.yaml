interface:
  display_name: "Writing Fragments"
  short_description: "Grilling session that mines the user for fragments - heterogeneous nuggets of writing (claims, vignettes, sharp sentences, half-thoughts) - and appends them to a single document as raw material for a future article. Use when the user wants to develop ideas before imposing structure, or mentions \"fragments\", \"ideate\", or \"raw material\" for writing."
