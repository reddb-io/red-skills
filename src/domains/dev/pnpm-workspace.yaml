# pnpm v11+ moved the "pnpm" field from package.json here.
# Approving build scripts lets `pnpm run` / feedback gates run non-interactively.
packages:
  - .

onlyBuiltDependencies:
  - esbuild

# esbuild needs its native binary built. @parcel/watcher and msgpackr-extract are
# optional native deps pulled transitively by @ai-hero/sandcastle (file-watching /
# msgpack) that the AFK run() path never uses — declined so pnpm doesn't block.
allowBuilds:
  esbuild: true
  '@parcel/watcher': false
  msgpackr-extract: false
